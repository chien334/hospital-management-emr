<div class="popup-static portlet box portlet-fullscreen" *ngIf="showAddPage">
    <div class="portlet-body form" style="background-color:white">
        <form [formGroup]="currentFiscalYear.FiscalYearValidator" class="form-horizontal">
            <div class="form-body">
                <div class="col-md-12">
                    <div class="col-md-2 hidden-xs hidden-sm" style="margin-right: 24px;">
                    </div>
                    <div class="col-md-8 col-sm-10 col-xs-10 modelbox-div" style="margin-right: 24px;">
                        <div class="col-md-12">
                            <div class="caption" style="color:blue;">
                                <h3>
                                    <span>{{ 'ACCOUNTING.CREATE_FISCAL_YEAR' | translate }}</span>
                                </h3>
                            </div>
                            <a style="float:right;  margin-top:-32px;" class="btn btn-danger" (click)="Close()" [title]="'COMMON.CANCEL' | translate">X</a>
                            <hr />
                        </div>
                        <div class="col-md-12">
                            <div class="col-md-8" style="margin-right: 24px;">
                                <div class="form-group">
                                    <label class="control-label col-md-4">{{ 'ACCOUNTING.FISCAL_YEAR_NAME' | translate }}<b style="float:right;">:</b></label>
                                    <div class="col-md-8">
                                        <input class="form-control" type="text" [(ngModel)]="currentFiscalYear.FiscalYearName" disabled
                                               formControlName="FiscalYearName" [placeholder]="'ACCOUNTING.FISCAL_YEAR_NAME' | translate" />
                                        <span class="color-red font-sm" [hidden]="currentFiscalYear.IsValidCheck('FiscalYearName','required') || !(currentFiscalYear.IsDirty('FiscalYearName'))">{{ 'ACCOUNTING.FISCAL_YEAR_NAME_REQUIRED' | translate }}</span>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="control-label col-md-4 left" style="padding-top: 1px;">{{ 'ACCOUNTING.START_YEAR' | translate }}<b style="float:right;">:</b></label>
                                    <div class="col-md-8">
                                        <dsf-date-picker [(ngModel)]="currentFiscalYear.StartDate" (ngModelChange)="selectProperFiscalYearName()"
                                                            formControlName="StartDate" ngDefaultControl [CalendarTypes]="calType">
                                        </dsf-date-picker>
                                        <span class="color-red font-sm" [hidden]="currentFiscalYear.IsValidCheck('StartDate','required') || !(currentFiscalYear.IsDirty('StartDate'))">{{ 'ACCOUNTING.START_DATE_REQUIRED' | translate }}</span>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="control-label col-md-4 left" style="padding-top: 1px;">{{ 'ACCOUNTING.END_YEAR' | translate }}<b style="float:right;">:</b></label>
                                    <div class="col-md-8">
                                        <dsf-date-picker [(ngModel)]="currentFiscalYear.EndDate" (ngModelChange)="selectProperFiscalYearName()" formControlName="EndDate"
                                                            ngDefaultControl [CalendarTypes]="calType">
                                        </dsf-date-picker>
                                        <span class="color-red font-sm" [hidden]="currentFiscalYear.IsValidCheck('EndDate','required') || !(currentFiscalYear.IsDirty('EndDate'))">{{ 'ACCOUNTING.END_DATE_REQUIRED' | translate }}</span>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="control-label col-md-4">{{ 'ACCOUNTING.DESCRIPTION_LABEL' | translate }}<b style="float:right;">:</b></label>
                                    <div class="col-md-8">
                                        <textarea class="form-control" type="text" [(ngModel)]="currentFiscalYear.Description"
                                                  [ngModelOptions]="{standalone: true}" [placeholder]="'ACCOUNTING.ENTER_DESCRIPTION' | translate">
                                       </textarea>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="control-label col-md-4">{{ 'ACCOUNTING.IS_ACTIVE_QUESTION' | translate }} <b style="float:right;">:</b> </label>
                                    <div class="col-md-8">
                                        <div class="input-group">
                                            <div class="icheck-inline">
                                                <label class="mt-checkbox mt-checkbox-outline">
                                                    <input name="IsActive" type="checkbox" value="" [(ngModel)]="currentFiscalYear.IsActive" [ngModelOptions]="{standalone: true}">
                                                    <span></span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <input type="button" class="btn btn-primary" (click)="AddFiscalYear()" [value]="'ACCOUNTING.ADD_LEDGER' | translate" />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-2 hidden-xs hidden-sm" style="margin-right: 24px;">
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
