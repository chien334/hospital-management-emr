<form class="form-horizontal hm-form">
  <div class="form-body">
    <div class="caption lb-caption">
      <i class="fa fa-money"></i>
      <span class="caption-subject">{{ 'INVENTORY.EXPIRABLE_STOCK_LEDGER' | translate }} </span>
    </div>
    <div class="row">
      <div class="col-md-6">
        <fiscal-year-calendar [showSingleDatePicker]="false" [showAllFiscalYear]="true" (fiscalYearDate)="onFromToDateChange($event)"> </fiscal-year-calendar>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4" style="display: flex;justify-content: flex-start;align-items: center;">
        <div>{{ 'INVENTORY.CATEGORY' | translate }} : &nbsp;&nbsp;</div>
        <div>
          <select [(ngModel)]="selectedCategory" [ngModelOptions]="{standalone: true}" (ngModelChange)="onCategoryChange(selectedCategory)">
            <option [ngValue]="0">{{ 'INVENTORY.ALL' | translate }}</option>
            <option *ngFor="let cat of categoryList" value="{{cat.ItemCategoryId}}"> {{cat.ItemCategoryName}} </option>
          </select>
        </div>
      </div>

      <div class="col-md-8" style="display: flex;justify-content: flex-start; align-items: center;">
        <div>{{ 'INVENTORY.SUB_CATEGORY' | translate }}:</div>
        <div class="col-md-6">
          <dsf-multiselect [ddl-data]="filteredSubCategoryList" [placeholder-text]="'---Select Subcategory Name---'" [value-property-name]="'SubCategoryId'" (selected-items-list)="onChangeColumnSelection($event)" [display-property-name]="'SubCategoryName'" [single-selection]="false">
          </dsf-multiselect>
        </div>
      </div>
    </div>
    <dsf-grid [grid-colDefaults]="expirableStockGridColumns" [grid-data]="filteredItemList" (grid-actions)="handleGridAction($event)" [grid-exportOptions]="getGridExportOptions()" [grid-showExport]="false" [show-print-button]="false">
    </dsf-grid>
  </div>
</form>

<div class="popup-static portlet box portlet-fullscreen" *ngIf="showDetailsBox">
  <div class="portlet-body form ">
    <div class="modelbox-div" style=" margin:25px 50px;">
      <div class="col-md-12">
        <a style="float:right; position: absolute; top:-26px; right:-26px;" class="btn btn-danger" (click)="close()" [title]="'COMMON.CANCEL' | translate">X</a>
      </div>
      <div>
        <app-expirable-stock-detail-view [fromDate]="fromDate" [toDate]="toDate" [selectedItemId]="selectedItemId" [fiscalYearId]="fiscalYearId"></app-expirable-stock-detail-view>
      </div>
    </div>
  </div>
</div>
