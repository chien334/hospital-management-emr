<div class="row">
  <div class="form-body">
    <div class="row">
      <div class="col-lg-6 col-md-6">
        <div class="row">
          <div class="col-md-5">
            <div class="caption custom-caption">
              <!-- <i class="glyphicon glyphicon-asterisk"></i> -->
              <span class="caption-subject">{{ 'PHARMACY.INSURANCE_PATIENT_BIMA_REPORT' | translate }}</span>
            </div>
          </div>
          <div class="col-md-7">
            <div class="alert alert-info warning-note">
              (<b>*{{ 'PHARMACY.NOTE' | translate }}:</b> {{ 'PHARMACY.RETURN_SALES_ARE_NOT_INCLUDED_IN' | translate }}
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-6 col-md-6">
        <div class="pull-right">
          <from-to-date-select (on-change)="OnFromToDateChange($event)" [date-settings-name]="'billing-reports'"> </from-to-date-select>
        </div>
      </div>
    </div>
  </div>
  <div class="form-body mt10">
    <div class="row">
      <div class="col-md-5">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group row">
              <label class="control-label col-md-4">{{GeneralFieldLabel.NSHINo}}:</label>
              <div class="col-md-8">
                <input type="text" name="NSHINumber" id="NSHINumber" [(ngModel)]="NSHINumber" class="form-control">
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group row">
              <label class="control-label col-md-4">{{ 'PHARMACY.CLAIMCODE' | translate }}:</label>
              <div class="col-md-8">
                <input type="text" name="ClaimCode" id="ClaimCode" [(ngModel)]="ClaimCode" class="form-control">
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-5">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group row">
              <label class="control-label col-md-4">{{ 'PHARMACY.COUNTER' | translate }}:</label>
              <div class="col-md-8">
                <select id="ddlCounter" [(ngModel)]="CounterId" class="form-control" [ngModelOptions]="{standalone: true}">
                  <option [ngValue]="null">{{ 'PHARMACY.ALL' | translate }}</option>
                  <option *ngFor="let counter of counterlist" value="{{counter.CounterId}}">{{counter.CounterName}}</option>
                </select>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group row">
              <label class="control-label col-md-4">{{ 'PHARMACY.USER' | translate }}:</label>
              <div class="col-md-8">
                <input dsf-auto-complete [(ngModel)]="selectedUser" class="form-control" [list-formatter]="UserListFormatter" [source]="userList"
                       [placeholder]="'PHARMACY.ENTER_USER_NAME' | translate" display-property-name="EmployeeName" value-property-name=null onclick="this.select();" id="user"
                       (valueChanged)="OnUserChange()" max-num-list="10" [ngModelOptions]="{standalone: true}" />
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-2">
        <div class="text-right">
          <button class="btn blue" type="button" (click)="LoadReport()" [disabled]="loading">
            <span *ngIf="!loading">{{ 'PHARMACY.SHOW_REPORT' | translate }}</span>
            <span *ngIf="loading">{{ 'PHARMACY.LOADING' | translate }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="row" style="margin-bottom:1rem;">
  <div class="">
    <dsf-grid [grid-colDefaults]="InsBimaColumn" [grid-data]="InsBimaData" [grid-exportOptions]="gridExportOptions"
                 [NepaliDateInGridParams]="NepaliDateInGridSettings" [grid-showExport]="true" [grid-footer-content]="footerContent"
                 [grid-date-range]="dateRange" [report-for]="pharmacy"> </dsf-grid>
  </div>

  <!-- Summary -->
  <div class="" style="margin-bottom: 10px !important; display: flex;justify-content: center;">
    <div class="table-responsive table-wrapper" id="print_summary">
      <table class="table table-bordered table-hover table-condensed custom_table padLess_table" border="1">
        <thead>
          <tr>
            <th colspan="4" style="text-align: center;">
              <span style="font-size:large;"> {{ 'PHARMACY.SUMMARY' | translate }} </span>

            </th>
          </tr>
        </thead>
        <tbody>
          <ng-container>
            <tr>
              <td style="font-weight:bold; color:blue">
                <span> <b> {{ 'PHARMACY.TOTAL_INSURANCE_SALES_VALUE' | translate }} </b> </span>
              </td>
              <td>
                <span style="font-size:2rem;"> {{grandTotal | Currency }}</span>
              </td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
  </div>
</div>
