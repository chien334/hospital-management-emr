<div class="popup-static portlet box portlet-fullscreen custom_modal" *ngIf="showAddPage">
  <div class="portlet-body form">
    <div class="row">
      <div class="col-md-6 col-md-offset-3">
        <div class="modelbox-div clearfix">
          <div class="caption custom-caption">
            <h3> <span *ngIf="!update">{{ 'SETTINGS_NEW.ADD_BED' | translate }}</span> <span *ngIf="update">{{ 'SETTINGS_NEW.UPDATE_BED' | translate }}</span> </h3>
            <a class="btn btn-danger" (click)="Close()" [title]="'COMMON.CANCEL' | translate">X</a>
          </div>

          <form [formGroup]="CurrentBed.BedMainValidator" class="form-horizontal hm-form">
            <div class="form-body">
              <div class="form-group">
                <label class="control-label col-md-4">{{ 'SETTINGS_NEW.WARD' | translate }}<sup>*</sup><b>:</b></label>
                <div class="col-md-4">
                  <select class="form-control" [(ngModel)]="CurrentBed.WardId" formControlName="WardId" (ngModelChange)="SetWardCode()">
                    <option *ngFor="let ward of wardList" value="{{ward.WardId}}"> {{ward.WardName}} </option>
                  </select>
                  <span class="color-red font-sm" [hidden]="CurrentBed.IsValidCheck('WardId','required') || !(CurrentBed.IsDirty('WardId'))">{{ 'SETTINGS_NEW.WARD' | translate }} Name
                    is Required</span>
                </div>
                <div class="col-md-4"> Last {{ 'SETTINGS_NEW.BED_NUMBER' | translate }} of {{wardName}} is {{lastBedNumber}} </div>
              </div>
              <div class="form-group">
                <div class="col-md-4"> </div>
                <div class="radio col-md-4">
                  <label class="mt-radio mt-radio-outline">
                    <input name="options" type="radio" [value]="true" [checked]="!showRange" (click)="changeRange('single')" /><span></span>
                    {{ 'SETTINGS_NEW.ADD_SINGLE_BED' | translate }}</label>
                </div>
                <!-- <div class="radio col-md-4">
                  <label class="mt-radio mt-radio-outline">
                    <input name="options" type="radio" [value]="false" [checked]="showRange" (click)="changeRange('range')" /><span></span>
                    Add Multiple Bed

                  </label>
                </div> -->
              </div>
              <div class="form-group" *ngIf="!showRange">
                <label class="control-label col-md-4">{{ 'SETTINGS_NEW.BED_NUMBER' | translate }}<sup>*</sup><b>:</b></label>
                <div class="col-md-8">
                  <input name="" class="form-control" formControlName="BedNumber" maxlength="30" [(ngModel)]="CurrentBed.BedNumber" id="BedNumber"
                         [placeholder]="'SETTINGS_NEW.ENTER_BED_NUMBER' | translate" />
                  <span class="color-red font-sm" [hidden]="CurrentBed.IsValidCheck('BedNumber','required') || !(CurrentBed.IsDirty('WardId'))">{{ 'SETTINGS_NEW.BED_NUMBER' | translate }} is Required</span>
                  <br />
                </div>
              </div>
              <!-- <div class="form-group" *ngIf="showRange && !update">
                <label class="control-label col-md-4">{{ 'SETTINGS_NEW.BED_NUMBER' | translate }} (Incase<b>:</b><br />
                  of multiple beds at a Time)</label>
                <div class="col-md-4">
                  <input type="number" name="" class="form-control" [(ngModel)]="CurrentBed.BedNumFrm" placeholder="From" id="BedNumFrm" [ngModelOptions]="{standalone: true}" />
                </div>
                <div class="col-md-4">
                  <input type="number" name="" class="form-control" [(ngModel)]="CurrentBed.BedNumTo" placeholder="To" id="BedNumTo" [ngModelOptions]="{standalone: true}" />
                </div>
              </div> -->
              <div class="form-group">
                <label class="control-label col-md-4">{{ 'SETTINGS_NEW.BED_FEATURES' | translate }}<sup>*</sup><b>:</b></label>
                <div class="col-md-8">
                  <!-- <div class="icheck-inline" *ngFor="let feature of bedFeatureList;let i=index;" style="display: inline-block; width: 50%; margin: 0;">
                    <label class="mt-checkbox mt-checkbox-outline">
                      <input type="checkbox" name="feature.BedFeatureId" [ngModelOptions]="{standalone: true}" [(ngModel)]="feature.IsSelected" (ngModelChange)="BedFeatureEventHandler(feature)" />
                      <span [ngClass]="feature.IsSelected ? 'bg-on' : 'bg-off'"></span> {{feature.BedFeatureName}}
                    </label> <br *ngIf="i%3==0 && i!=0" />
                  </div> -->
                  <input style="width: 100%;" danphe-auto-complete [source]="bedFeatureList" [(ngModel)]="selectedBedFeature"
                         [placeholder]="'SETTINGS_NEW.SELECT_BED_FEATURE' | translate" max-num-list="8" min-chars="0" display-property-name="BedFeatureName"
                         [list-formatter]="BedFeatureFormatter" onclick="select()" (valueChanged)="BedFeatureEventHandler()"
                         [ngModelOptions]="{standalone:true}" value-property-name="BedFeatureId">
                </div>
              </div>
              <!--<div style="width:100%;">
                                    <table style="width:100%;">
                                        <tr>
                                            {{ 'SETTINGS_NEW.BED_FEATURES' | translate }}
                                        </tr>
                                        <tr>
                                            <td style="width:60%;"></td>
                                        </tr>
                                    </table>
                                </div>-->
              <div class="form-group">
                <label class="control-label col-md-4">{{ 'GRID_HEADERS.IS_ACTIVE' | translate }} <b>:</b> </label>
                <div class="col-md-8">
                  <div class="input-group">
                    <div class="icheck-inline no-margin">
                      <label class="mt-checkbox mt-checkbox-outline">
                        <input id="isActive" name="isActive" type="checkbox" value="" [(ngModel)]="CurrentBed.IsActive"
                               [ngModelOptions]="{standalone: true}">
                        <span></span> </label>
                    </div>
                  </div>
                </div>
              </div>


            </div>
            <div class="panel-footer">
              <input type="button" class="btn btn-primary" *ngIf="!update" (click)="Add()" [value]="'SETTINGS_NEW.ADD' | translate" />
              <input type="button" class="btn btn-primary" *ngIf="update" (click)="Update()" [value]="'COMMON.UPDATE' | translate" />
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
