<style>
  .pad-0-rt {
    padding-right: 0px;
  }

  .msg-icn-err {
    color: #f36a5a;
    font-size: 14px;
  }

  .is-ref {
    font-size: 11px;
    position: relative;
    top: 0;
    left: 0;
    padding-top: 8px;
  }

  .d-i-f {
    display: inline-block;
    margin-left: 8px;
    position: inherit;
  }

  .ref-er .row {
    position: relative;
    left: -15px;
  }

  .text-wit-btn {
    display: flex;
    /*margin-top: 5px;*/
  }
</style>

<div class="row">
  <!--<div class="col-md-2 ex-t">
    <span *ngIf="includeExtReferrer">(external)</span>
    <span *ngIf="!includeExtReferrer">(internal) </span>
  </div>-->
  <div class="col-md-6 pad-0-rt">
    <input *ngIf="filteredReferrerList" class="form-control cstm-form-control" id="id_input_currentRequestedByDoctor_selectReferral"
           danphe-auto-complete
           [ngModelOptions]="{standalone: true}" [(ngModel)]="currentRequestedByDoctor"
           [source]="filteredReferrerList"
           [list-formatter]="AssignedToDocListFormatter" [placeholder]="'SETTINGS_NEW.ENTER_NAME' | translate"
           display-property-name="FullName" value-property-name=null match-formatted="true"
           (focusout)="RequestedByDrOnChange()" (keyup.enter)="OnPressedEnterKeyInReferrerField()" onClick="this.select();" max-num-list="10" />
    <!--<button type="button" class="btn btn-xs blue" *ngIf="defaultRefInfo && defaultRefInfo.ShowButton" (click)="SelectDefault()" style="margin-left:30px;">
      {{defaultRefInfo.ButtonLabel}}
    </button>-->
    <!--<span *ngIf="!isValidReferrerSelection" style="color:red;">Invalid Referrer. Please choose from list or add new (for External).</span>-->
    <i class="fa fa-close msg-icn-err" *ngIf="!isValidReferrerSelection"
       [title]="'SETTINGS_NEW.INVALID_REFERRER_PLEASE_CHOOSE_FROM_LIST_OR_ADD_NEW_FOR_EXTERNAL' | translate">&nbsp;{{ 'SETTINGS_NEW.INVALID_NAME' | translate }} </i>
  </div>
  <div class="col-md-5" *ngIf="allowExternalRef">
    <div class="text-wit-btn">
      <div class="icheck-inline">
        <label for="id_checkbox_includeExternalReferral" class="is-ref mt-checkbox mt-checkbox-outline"><input type="checkbox"
                 id="id_checkbox_includeExternalReferral" [(ngModel)]="includeExtReferrer" [title]="'SETTINGS_NEW.INCLUDE_EXTERNAL_REFERRERS' | translate"
                 (change)="ReferrerChkBoxOnChange()" />
          <span></span>{{ 'SETTINGS_NEW.EXTERNAL' | translate }}</label>
      </div>
      <div *ngIf="includeExtReferrer" class="d-i-f">
        <a feature="button" class="btn blue btn-xs btn-ext" [title]="'SETTINGS_NEW.CLICK_TO_ADD_NEW_EXTERNAL_REFFERER' | translate" (click)="showExtRefPopup=true;"><i
             class="fa fa-plus"></i></a>
      </div>
    </div>

  </div>

</div>


<ext-referral-add *ngIf="showExtRefPopup" (callback-add)="ExtRefPopupOnClose($event)">
</ext-referral-add>
