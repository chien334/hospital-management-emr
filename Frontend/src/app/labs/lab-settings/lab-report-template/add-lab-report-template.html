<style></style>

<!--Model Box Starting Here-->
<div class="popup-static portlet box portlet-fullscreen" *ngIf="showTemplateAddPage">
  <div class="portlet-body form">
    <div class="col-md-12">
      <div class="modelbox-div lab_modal_box">
        <div class="modelbox-header">
          <h4 class="margin-0-vr"> <strong>
            <ng-container *ngIf="!update">{{ 'LABS.ADD_LAB_REPORT_TEMPLATE' | translate }}</ng-container>
            <ng-container *ngIf="update">{{ 'LABS.UPDATE_LAB_REPORT_TEMPLATE' | translate }}</ng-container>
            </strong> </h4>
        </div>
        <div class="modelbox-body">
         
            <form [formGroup]="rptTemplate.ReportTemplateValidator" class="form-horizontal hm-form mlr">
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <div class="row">
                      <label class="control-label col-md-4">{{ 'LABS.REPORT_TEMPLATE_NAME' | translate }}<sup class="color-red">*</sup><b>:</b></label>
                      <div class="col-md-8">
                        <input class="form-control" maxlength="30"
                               [(ngModel)]="rptTemplate.ReportTemplateName"
                               formControlName="ReportTemplateName"
                               required
                               value=""
                               type="text" id="ReportTemplateName" [placeholder]="'LABS.REPORT_TEMPLATE_NAME' | translate" />
                        <span class="color-red font-sm" [hidden]="rptTemplate.IsValidCheck('ReportTemplateName','required') || !(rptTemplate.IsDirty('ReportTemplateName'))">{{ 'LABS.ENTER_REPORT_TEMPLATE_NAME' | translate }}</span> </div>
                    </div>
                  </div>
                  <div class="form-group">
                    <div class="row">
                      <label class="control-label col-md-4">{{ 'GRID_HEADERS.DESCRIPTION' | translate }}<b>:</b></label>
                      <div class="col-md-8">
                        <input class="form-control" maxlength="30"
                               [(ngModel)]="rptTemplate.Description"
                               [ngModelOptions]="{standalone: true}"
                               type="text" id="ReportDescription" [placeholder]="'LABS.REPORT_DESCRIPTION' | translate" />
                      </div>
                    </div>
                  </div>                
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <div class="row">
                      <label class="control-label col-md-5">{{ 'LABS.REPORT_TEMPLATE_SHORT_NAME' | translate }}<sup class="color-red">*</sup><b>:</b></label>
                      <div class="col-md-7">
                        <input class="form-control" maxlength="30"
                               [(ngModel)]="rptTemplate.ReportTemplateShortName"
                               formControlName="ReportTemplateShortName"
                               required
                               value=""
                               type="text" id="ReportTemplateShortName" [placeholder]="'LABS.REPORT_TEMPLATE_SHORT_NAME' | translate" />
                        <span class="color-red font-sm" [hidden]="rptTemplate.IsValidCheck('ReportTemplateShortName','required') || !(rptTemplate.IsDirty('ReportTemplateShortName'))">{{ 'LABS.ENTER_REPORT_TEMPLATE_NAME' | translate }}</span> </div>
                    </div>
                  </div>
                  <div class="form-group">
                    <div class="row">
                      <label class="control-label col-md-5">{{ 'LABS.REPORT_TEMPLATE_TYPE' | translate }}<sup class="color-red">*</sup><b>:</b></label>
                      <div class="col-md-7">
                        <select class="form-control" [(ngModel)]="rptTemplate.TemplateType" [ngModelOptions]="{standalone: true}" (change)="DDLChange()" id="ReportTemplateType" [placeholder]="'LABS.REPORT_TEMPLATE_TYPE' | translate">
                          <option value="normal">{{ 'LABS.NORMAL' | translate }}</option>
                          <option value="html">{{ 'LABS.WORD_EDITOR' | translate }}</option>
                          <option value="culture">{{ 'LABS.CULTURE_SENSITIVITY' | translate }}</option>
                        </select>
                      </div>
                    </div>
                  </div>                  
                  
                </div>
				  <div class="col-md-12">
				  	<div class="form-group">
                    <div class="row">
                      <label class="control-label col-md-2">{{ 'LABS.COLUMN_SETTINGS' | translate }}<b>:</b> </label>
                      <div class="col-md-10">
						  <div class="colsetting-name">
                        <label class="mt-checkbox mt-checkbox-outline" for="selectall">
                          <input id="selectall" class="zoomcheckbox pull-left" [(ngModel)]="colSettings.SelectAll" width="100" type="checkbox" ng-checked="colSettings.SelectAll=true"
                                 (change)="ColSettingsData()" [ngModelOptions]="{standalone: true}">
                          <span></span>{{ 'LABS.SELECT_ALL' | translate }}</label>
                        <!--
                        <label for="selectall">
                          <input id="selectall" class="zoomcheckbox pull-left" [(ngModel)]="colSettings.SelectAll" width="100" type="checkbox" ng-checked="colSettings.SelectAll=true"
                                 (change)="ColSettingsData()" [ngModelOptions]="{standalone: true}">
                          Select All </label>
--> 
                      </div>
                        <div class="colsetting-name">
                          <label class="mt-checkbox mt-checkbox-outline" for="name">
                            <input id="name" class="zoomcheckbox pull-left" [(ngModel)]="colSettings.Name" width="100" type="checkbox" ng-checked="colSettings.Name=true"
                                   (change)="checkAllTrueOrFalse()" [ngModelOptions]="{standalone: true}">
                            <span></span>{{ 'COMMON.NAME' | translate }} </label>
                          <!--
                          <label for="name">
                            <input id="name" class="zoomcheckbox pull-left" [(ngModel)]="colSettings.Name" width="100" type="checkbox" ng-checked="colSettings.Name=true"
                                   (change)="checkAllTrueOrFalse()" [ngModelOptions]="{standalone: true}">
                            Name </label>
--> 
                        </div>
                        <div class="colsetting-name">
                          <label class="mt-checkbox mt-checkbox-outline" for="result">
                            <input id="result" class="zoomcheckbox pull-left" [(ngModel)]="colSettings.Result" width="100" type="checkbox" ng-checked="colSettings.Result=true"
                                   (change)="checkAllTrueOrFalse()" [ngModelOptions]="{standalone: true}">
                            <span></span>{{ 'LABS.RESULT' | translate }} </label>
                          <!--
                          <label for="result">
                            <input id="result" class="zoomcheckbox pull-left" [(ngModel)]="colSettings.Result" width="100" type="checkbox" ng-checked="colSettings.Result=true"
                                   (change)="checkAllTrueOrFalse()" [ngModelOptions]="{standalone: true}">
                            Result </label>
--> 
                        </div>
                        <div class="colsetting-name">
                          <label class="mt-checkbox mt-checkbox-outline" for="range">
                            <input id="range" class="zoomcheckbox pull-left" [(ngModel)]="colSettings.Range" width="100" type="checkbox" ng-checked="colSettings.Range=true"
                                   (change)="checkAllTrueOrFalse()" [ngModelOptions]="{standalone: true}">
                            <span></span>{{ 'LABS.RANGE' | translate }} </label>
                          <!--
                          <label for="range">
                            <input id="range" class="zoomcheckbox pull-left" [(ngModel)]="colSettings.Range" width="100" type="checkbox" ng-checked="colSettings.Range=true"
                                   (change)="checkAllTrueOrFalse()" [ngModelOptions]="{standalone: true}">
                            Range </label>
--> 
                        </div>
                        <div class="colsetting-name">
                          <label class="mt-checkbox mt-checkbox-outline" for="method">
                            <input id="method" class="zoomcheckbox pull-left" [(ngModel)]="colSettings.Method" width="100" type="checkbox" ng-checked="colSettings.Method=true"
                                   (change)="checkAllTrueOrFalse()" [ngModelOptions]="{standalone: true}">
                            <span></span>{{ 'LABS.METHOD' | translate }} </label>
                          <!--
                          <label for="method">
                            <input id="method" class="zoomcheckbox pull-left" [(ngModel)]="colSettings.Method" width="100" type="checkbox" ng-checked="colSettings.Method=true"
                                   (change)="checkAllTrueOrFalse()" [ngModelOptions]="{standalone: true}">
                            Method </label>
--> 
                        </div>
                        <div class="colsetting-name">
                          <label class="mt-checkbox mt-checkbox-outline" for="unit">
                            <input id="unit" class="zoomcheckbox pull-left" [(ngModel)]="colSettings.Unit" width="100" type="checkbox" ng-checked="colSettings.Unit=true"
                                   (change)="checkAllTrueOrFalse()" [ngModelOptions]="{standalone: true}">
                            <span></span>{{ 'LABS.UNIT' | translate }} </label>
                          <!--
                          <label for="unit">
                            <input id="unit" class="zoomcheckbox pull-left" [(ngModel)]="colSettings.Unit" width="100" type="checkbox" ng-checked="colSettings.Unit=true"
                                   (change)="checkAllTrueOrFalse()" [ngModelOptions]="{standalone: true}">
                            Unit </label>
--> 
                        </div>
                        <div class="colsetting-name">
                          <label class="mt-checkbox mt-checkbox-outline" for="remarks">
                            <input id="remarks" class="zoomcheckbox pull-left" [(ngModel)]="colSettings.Remarks" width="100" type="checkbox" ng-checked="colSettings.Remarks=true"
                                   (change)="checkAllTrueOrFalse()" [ngModelOptions]="{standalone: true}">
                            <span></span>{{ 'COMMON.REMARKS' | translate }} </label>
                          <!--
                          <label for="remarks">
                            <input id="remarks" class="zoomcheckbox pull-left" [(ngModel)]="colSettings.Remarks" width="100" type="checkbox" ng-checked="colSettings.Remarks=true"
                                   (change)="checkAllTrueOrFalse()" [ngModelOptions]="{standalone: true}">
                            Remarks </label>
--> 
                        </div>
                      </div>
                    </div>
                  </div>
				  </div>
				  <div class="col-md-6">
				  	<div class="form-group">
                    <div class="row">
                      <label class="control-label col-md-4">{{ 'LABS.HEADER_TEXT' | translate }}<b>:</b> </label>
                      <div class="col-md-8">
                        <input class="form-control" rows="4"
                               [(ngModel)]="rptTemplate.HeaderText"
                               [ngModelOptions]="{standalone: true}"
                               type="text" id="headerDescription" [placeholder]="'LABS.HEADER_DESCRIPTION' | translate">
                      </div>
                    </div>
                  </div>
					  <div class="form-group">
                    <div class="row">
                      <label class="control-label col-md-4">{{ 'LABS.FOOTER_TEXT' | translate }}<b>:</b> </label>
                      <div class="col-md-8">
                        <textarea class="form-control" rows="4"
                                  [(ngModel)]="rptTemplate.FooterText"
                                  [ngModelOptions]="{standalone: true}"
                                  type="text" id="footerDescription" [placeholder]="'LABS.FOOTER_DESCRIPTION' | translate">
                                            </textarea>
                      </div>
                    </div>
                  </div>
				  </div>
				  <div class="col-md-6">
				  	<div class="form-group">
                    <div class="row">
                      <div class="col-md-6">
                        <div class="row">
                          <label class="control-label col-md-8">{{ 'LABS.IS_DEFAULT' | translate }} <b>:</b> </label>
                          <div class="col-md-4">
                            <div class="input-group">
                              <div class="icheck-inline">
                                <label class="mt-checkbox mt-checkbox-outline">
                                  <input id="isDefault" name="isDefault" type="checkbox"
                                     [(ngModel)]="rptTemplate.IsDefault"
                                     [ngModelOptions]="{standalone: true}">
                                  <span></span> </label>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                      <!-- <div class="col-md-6">
                        <div class="row">
                          <label class="control-label col-md-8">Is Active <b>:</b> </label>
                          <div class="col-md-4">
                            <div class="input-group">
                              <div class="icheck-inline">
                                <label class="mt-checkbox mt-checkbox-outline">
                                  <input id="isActive" name="isActive" type="checkbox"
                                     [(ngModel)]="rptTemplate.IsActive"
                                     [ngModelOptions]="{standalone: true}">
                                  <span></span> </label>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div> -->
					
                    </div>
                  </div>
                  <div class="form-group">
                    <div class="row">
                      <label class="control-label col-md-5">{{ 'LABS.DISPLAY_SEQUENCE' | translate }}<b>:</b></label>
                      <div class="col-md-7">
                        <input type="number" [(ngModel)]="rptTemplate.DisplaySequence" [ngModelOptions]="{standalone: true}">
                      </div>
                    </div>
                  </div>
				  </div>
              </div>
              <div class="form-group" *ngIf="rptTemplate.TemplateType == 'html'">                
                  <dsf-ckeditor [readonly]="isReadOnly" (get-html-content)="onChangeEditorData($event)" [set-html-content]="rptTemplate.TemplateHTML"> 
                  </dsf-ckeditor>               
              </div>
            </form>         
        </div>
        <div class="modelbox-footer">
          <div class="all-buttons text-right">
            <button class="btn primary-btn margin-7-hr" *ngIf="!update" (click)="AddReportTemplate()">{{ 'LABS.ADD_TEMPLATE' | translate }}</button>
            <button class="btn primary-btn margin-7-hr" *ngIf="update" (click)="UpdateReportTemplate()">{{ 'COMMON.UPDATE' | translate }}</button>
            <!-- <button class="btn btn-cancel btn-outline margin-7-hr" (click)="Close()">Cancel</button> -->
          </div>
        </div>
        <div class="close-modelbox lb-close-btn">
          <button class="btn btn-danger" (click)="Close()"><i class="fa fa-times"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>
