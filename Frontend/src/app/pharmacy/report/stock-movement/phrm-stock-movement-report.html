<div class="row">
    <div class="form-body">
        <div class="col-md-12">
            <div class="caption">
                <i class="glyphicon glyphicon-asterisk font-red-sunglo"></i>
                <span class="caption-subject font-red-sunglo bold uppercase">Stock&nbsp;Movement&nbsp; Report</span>
            </div>

            <div class="col-md-5 col-xs-12">
                <div class="form-group">
                    <label class="control-label col-md-5">{{ 'PHARMACY.ITEM_NAME' | translate }}<b style="float:right;">:</b></label>
                    <div class="col-md-7">
                        <input class="form-control" type="text" value="" style="width:250px " [(ngModel)]="ItemName"
                               [placeholder]="'PHARMACY.ENTER_ITEM_NAME' | translate" />
                    </div>
                </div>
            </div>
            <div class="col-md-2 col-xs-12">
                <div class="col-md-2 col-xs-12">
                    <div class="form-group">
                        <button class="btn blue" type="button" (click)="GetReportData()">
                            <i class="fa fa-search"></i>
                            {{ 'PHARMACY.SHOW_REPORT' | translate }}
                        </button>
                    </div>
                </div>
            </div>
        </div>


    </div>


</div>


<div class="row">
    <div class="col-lg-12 col-sm-12">
        <dsf-grid [grid-colDefaults]="PHRMStockMovementReportColumns"
                     [grid-data]="PHRMStockMovementReportData"
                     [grid-exportOptions]="gridExportOptions"
                     [grid-showExportNew]="true"
                     (grid-onExport)="OnGridExport($event)">
        </dsf-grid>
    </div>
</div>
