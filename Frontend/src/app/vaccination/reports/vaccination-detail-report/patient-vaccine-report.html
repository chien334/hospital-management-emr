<div class="wrapper">

    <div class="row">
        <div class="col-lg-6 col-sm-6">
            <div class="caption lb-caption">
                <!-- <i class="glyphicon glyphicon-asterisk font-green-turquoise"></i> -->
                <span class="caption-subject">{{ 'VACCINATION.VACCINATION_DETAILS' | translate }}</span>
            </div>
        </div>
        <div class="col-lg-2 col-sm-2">
            <select class="form-control" [(ngModel)]="gender" (change)="GenderChanged()">
                <option value="All" selected>{{ 'COMMON.ALL' | translate }}</option>
                <option value="Male">{{ 'VACCINATION.MALE' | translate }}</option>
                <option value="Female">{{ 'VACCINATION.FEMALE' | translate }}</option>
                <option value="Others">{{ 'VACCINATION.OTHER' | translate }}</option>
            </select>
        </div>
        <div class="col-lg-4 col-sm-4">
            <vaccine-select (selected-vaccine-list)="VaccineOnSlected($event)"></vaccine-select>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-12 col-sm-12">
            <dsf-grid [grid-colDefaults]="vaccinationPatientReportGridColumns" [grid-data]="reportData"
            [grid-exportOptions]="gridExportOptions"
                [grid-showExport]="true" (onDateChange)="onDateChange($event)"
                [date-settings-name]="'common-range-with-today'" [show-CustomDate]="true">
            </dsf-grid>
        </div>
    </div>
</div>
