<div>
    <input type="button" class="btn btn-primary" (click)="AddVoucher()" [value]="'ACCOUNTING.CREATE_VOUCHER' | translate" />
    <voucher-add [showAddPage]="showAddPage"
                 [selectedVoucher]="selectedVoucher"
                 (callback-add)="CallBackAdd($event)"></voucher-add>
</div>
<div  class="row">
    <div class="col-md-12 col-xs-12 col-sm-12">
        <dsf-grid [grid-colDefaults]="voucherGridColumns" [grid-data]="voucherList" (grid-actions)="VoucherGridActions($event)">
        </dsf-grid>
    </div>
</div>
