<div class="row">
  <div class="form-body">
    <div class="col-md-12">
      <div class="caption custom-caption"> <i class="glyphicon glyphicon-asterisk"></i> <span class="caption-subject">{{ 'DISPENSARY.REPORTS.CASH_COLLECTION_SUMMARY' | translate }}</span> </div>
      <div class="row">
        <div class="col-md-6">
          <from-to-date-select (on-change)="OnFromToDateChange($event)" [date-settings-name]="'billing-reports'"> </from-to-date-select>
        </div>
        <div class="col-md-4 col-xs-12">
          <div class="form-group row">
            <label class="control-label col-md-5">{{ 'DISPENSARY.REPORTS.SELECT_DISPENSARY' | translate }}<b style="float:right;">:</b></label>
            <div class="col-md-7">
              <input danphe-auto-complete [(ngModel)]="selectedDispensary" class="form-control" [list-formatter]="DispensaryListFormatter" [source]="dispensaryList" [placeholder]="'DISPENSARY.REPORTS.SELECT_DISPENSARY' | translate" display-property-name="Name" value-property-name=null onclick="this.select();" id="dispensary" (valueChanged)="OnDispensaryChange()" max-num-list="10" [ngModelOptions]="{standalone: true}" />
            </div>
          </div>
        </div>
        <div class="col-md-2 col-xs-12">
          <div class="form-group">
            <button class="btn blue" type="button" (click)="Load()"> {{ 'DISPENSARY.REPORTS.SHOW_REPORT' | translate }}</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="row">
  <div class="col-lg-12 col-sm-12">
    <danphe-grid [grid-colDefaults]="PHRMUserReportColumn" [grid-data]="PHRMUserReportData" [NepaliDateInGridParams]="NepaliDateInGridSettings" [grid-exportOptions]="gridExportOptions" [grid-showExport]="true"> </danphe-grid>
  </div>
</div>
