<a feature="button" class="btn blue bordered" (click)="AddSubdivision()"><i class="fa fa-plus"></i>{{ 'SETTINGS_NEW.ADD_SUB_DIVISION' | translate }}</a>

<subdivision-add [showAddPage]="showAddPage"
             [selectedSubdivision]="subDivisionSelected"
             (callback-Add)="CallBackAdd($event)" [update]="update"></subdivision-add>


<div *ngIf="showSubDivisionList" class="row">
    <div class="col-md-12 col-xs-12 col-sm-12">
        <dsf-grid [grid-colDefaults]="subDivisionGridColumns" [grid-data]="subDivisionList" (grid-actions)="SubdivisionGridActions($event)"
                     [show-print-button]="false">
        </dsf-grid>
    </div>
</div>
