<style>
    .mat-dialog-content {
        overflow: hidden;
    }

    .btn-dialog {
        padding: 3px 10px;
        font-size: 11px;
    }

    .btn-dialog.blue:not(.btn-outline) {
        color: #FFF;
        background-color: #3598dc;
        border-color: #3598dc;
    }

    .btn-dialog.red:not(.btn-outline) {
        color: #FFF;
        background-color: #c51b26;
        border-color: #a1161f;
    }
</style>
<div mat-dialog-content>
    <h4><b>{{ 'PAYROLL.NOW' | translate }}: {{Status}}</b></h4><br />
    <mat-radio-group aria-label="Select an option" [(ngModel)]="Attendance.AttStatus" >
        <mat-radio-button  value="A">{{ 'PAYROLL.ABSENT' | translate }}</mat-radio-button><br />
        <mat-radio-button  value="P">{{ 'PAYROLL.PRESENT' | translate }}</mat-radio-button><br />
        <mat-radio-button  value="HL">{{ 'PAYROLL.HALF_DAY_LEAVE' | translate }}</mat-radio-button><br />
        <mat-radio-button  value="OFF">{{ 'PAYROLL.OFF' | translate }}</mat-radio-button><br />
    </mat-radio-group>
</div>
<div mat-dialog-actions>
    <button class="blue btn-dialog" (click)="Save()">{{ 'COMMON.SAVE' | translate }}</button>&nbsp;
    <button class="red btn-dialog" (click)="Close()" >{{ 'COMMON.CLOSE' | translate }}</button>
</div>
