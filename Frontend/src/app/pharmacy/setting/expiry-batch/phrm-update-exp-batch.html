<!--Model Box Starting Here-->
<div class="popup-static portlet box portlet-fullscreen inv_modal"  *ngIf="currentStock">
  <div class="portlet-body form">
    <!--Model Box Body Start-->
    <div class="row">
      <div class="col-md-4 col-md-offset-4">
        <div class="modelbox-div clearfix">
          <div class="caption lb-caption">
            <h3>{{ 'PHARMACY.UPDATE_EXPIRY_DATE_AND_BATCH_NO' | translate }}</h3>
            <a class="btn btn-danger"
              (click)="Close()"
              [title]="'COMMON.CANCEL' | translate">{{ 'PHARMACY.X' | translate }}</a>
          </div>
          <form class="form-horizontal hm-form">
            <div class="form-body">
              <div class="form-group">
                <label class="control-label col-md-5">{{ 'PHARMACY.ENTER_NEW_EXPIRY_DATE' | translate }}<sup>*</sup><b>:</b></label>
                <div class="col-md-7">
                  <input class="form-control"
                    type="date"
                    maxlength="50"
                    [ngModelOptions]="{standalone: true}"
                    [(ngModel)]="currentStock.ExpiryDate"
                    value=""
                    [placeholder]="'PHARMACY.ENTER_NEW_VALID_EXPIRYDATE' | translate" />
                  <span class="color-red font-sm"
                    *ngIf="CheckExpirtyDateandBatchNoValidation() == false">{{ 'PHARMACY.REQUIRED_VALID_SALEPRICE_ONLY' | translate }}
                  </span>
                </div>
              </div>
              <div class="form-group">
                <label class="control-label col-md-5">{{ 'PHARMACY.OLD_EXPIRY_DATE' | translate }}<b>:</b></label>
                <div class="col-md-7">
                  <b>{{oldExpiryDate}}</b>
                </div>
              </div>

              <div class="form-group">
                <label class="control-label col-md-5">{{ 'PHARMACY.ENTER_NEW_BATCHNO' | translate }}<sup>*</sup><b>:</b></label>
                <div class="col-md-7">
                  <input class="form-control"
                    
                    maxlength="50"
                    [ngModelOptions]="{standalone: true}"
                    [(ngModel)]="currentStock.BatchNo"
                    value=""
                    [placeholder]="'PHARMACY.ENTER_NEW_VALID_BATCHNO' | translate" />
                  <span class="color-red font-sm"
                    *ngIf="CheckExpirtyDateandBatchNoValidation() == false">{{ 'PHARMACY.REQUIRED_VALID_BATCH_NO_ONLY' | translate }}
                  </span>
                </div>
              </div>
              <div class="form-group">
                <label class="control-label col-md-5">{{ 'PHARMACY.OLD_BATCH_NO' | translate }}<b>:</b></label>
                <div class="col-md-7">
                  <b>{{oldBatchNo}}</b>
                </div>
              </div>
              <div class="form-actions">
                <input type="button"
                  class="btn btn-primary"
                  (click)="Update()"
                  [value]="'COMMON.UPDATE' | translate" />
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!--</form>-->
    <!--Model Box Body End-->
  </div>
</div>
