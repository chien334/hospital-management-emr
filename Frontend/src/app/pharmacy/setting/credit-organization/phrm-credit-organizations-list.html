<a feature="button" class="btn blue bordered" (click)="AddCreditOrganization()"><i class="fa fa-plus"></i>{{ 'PHARMACY.ADD_ORGANIZATION' | translate }}</a>
<phrm-credit-organizations [showAddPage]="showAddPage" *ngIf="showAddPage"
                   [selectedItem]="selectedItem"
                   (callback-add)="CallBackAdd($event)"></phrm-credit-organizations>

<div *ngIf="showGrid" class="row">
    <div class="col-md-8 col-xs-12 col-sm-12">
        <dsf-grid [grid-colDefaults]="creditOrganizationGridColumns" [grid-data]="creditOrganizationList" (grid-actions)="CreditOrganizationGridActions($event)"
                     [show-print-button]="false">
        </dsf-grid>
    </div>
</div>
