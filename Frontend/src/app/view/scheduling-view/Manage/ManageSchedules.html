<div class="caption">
    <i class="glyphicon glyphicon-asterisk font-green-turquoise"></i>
    <span class="caption-subject font-blue-sharp bold uppercase">{{ 'SCHEDULING.MANAGE_SCHEDULES' | translate }}</span>
</div>
<br />
<div class="row" style="padding-bottom:10px">
    <div class="col-md-6">
        <label class="control-label col-md-4 left" style="padding-top: 7px;">
            {{ 'SCHEDULING.SELECT_EMPLOYEES' | translate }}
            <b style="float:right;">:</b>
        </label>
        <div class="col-md-8">
            <dsf-multiselect [ddl-data]="EmployeeList"
                                [placeholder-text]="'SCHEDULING.SELECT_EMPLOYEES' | translate"
                                [value-property-name]="'EmployeeId'"
                                (selected-items-list)="onChange($event)"
                                [display-property-name]="'EmployeeName'"
                                [single-selection]="false">
            </dsf-multiselect>
        </div>
    </div>
    <div class="col-md-2">
        <button class="blue btn" (click)="reqType='week';loadCurrentWeek()">
            <i class="fa fa-refresh "></i>&nbsp;{{ 'SCHEDULING.RELOAD' | translate }}
        </button>
    </div>
</div>

<div class="col-md-12">
    <div class="col-md-5" *ngIf="showSelectedEmp">
        <div class="btn-group right">
            <button class="blue btn" (click)="loadPreviousWeek()" [disabled]="prevDisable"><i class="fa fa-backward"></i>&nbsp;{{ 'SCHEDULING.PREVIOUS' | translate }}</button>
            <button class="blue btn" (click)="loadCurrentWeek()">{{ 'SCHEDULING.CURRENT' | translate }}</button>
            <button class="blue btn" (click)="loadNextWeek()" [disabled]="nextDisable">{{ 'SCHEDULING.NEXT' | translate }}&nbsp;<i class="fa fa-forward"></i></button>          
        </div>
    </div>
    <div class="col-md-1" *ngIf="showSelectedEmp">
        <span *ngIf="reqType=='week'"><b>{{ 'SCHEDULING.WEEK_NO' | translate }} {{loadedWeek}}</b></span>
        <span *ngIf="reqType=='month'"><b>{{monthName}}</b></span>
    </div>
    <div class="col-md-2" *ngIf="showSelectedEmp">
        <div class="btn-group">
            <input type="button" class="blue btn" [value]="'SCHEDULING.WEEK' | translate" (click)="reqType='week';loadCurrentWeek()" />
            <input type="button" class="blue btn" [value]="'SCHEDULING.MONTH' | translate" (click)="reqType='month';month()" />
        </div>
    </div>
</div>
<div class="row" *ngIf="showSelectedEmp">
    <div class="col-md-12">
        <div class="table-responsive">
            <table class="table table-striped table-hover" style="background-color:initial;margin-top:10px">
                <thead>
                    <tr>
                        <th><b>{{ 'SCHEDULING.DEPARTMENT_NAME' | translate }}</b></th>
                        <th><b>{{ 'SCHEDULING.EMPLOYEE_NAME' | translate }}</b></th>
                        <td *ngFor="let data of dates" style="width:100px">{{data.date}}<br />({{data.shortDay}})</td>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let row of empSchedules">
                        <td>{{row.DepartmentName}}</td>
                        <td>{{row.EmployeeName}}</td>
                        <td *ngFor="let days of row.EmployeeSchedules">
                            <label class="mt-checkbox mt-checkbox-outline">
                                <input name="IsActive" type="checkbox" [(ngModel)]="days.IsWorkingDay" [checked]="days.IsWorkingDay">
                                <span></span>
                            </label>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="col-md-12" style="text-align:center">
        <input type="button" class="btn btn-success" [value]="'COMMON.SAVE' | translate" (click)="saveEmpSchedules()" [disabled]="loading" />
        <span></span>
        <input type="button" class="btn btn-danger" [value]="'COMMON.CANCEL' | translate" (click)="Cancel()">
    </div>
</div>
