<div class="popup-static portlet box portlet-fullscreen custom_modal" *ngIf="showAddPage">
  <div class="portlet-body form">
    <div class="row">
      <div class="col-md-4 col-md-offset-4">
        <div class="modelbox-div clearfix">
          <div class="caption custom-caption">
            <h3> <span *ngIf="!update">{{ 'EMPLOYEE.ADD_EMPLOYEE_TYPE' | translate }}</span> <span *ngIf="update">{{ 'EMPLOYEE.UPDATE_EMPLOYEE_TYPE' | translate }}</span> </h3>
            <a class="btn btn-danger" (click)="Close()" [title]="'COMMON.CANCEL' | translate">X</a> </div>
          <form [formGroup]="CurrentEmployeeType.EmployeeTypeValidator" class="form-horizontal hm-form">
            <div class="form-body">
              <div class="form-group">
                <label class="control-label col-md-4">{{ 'EMPLOYEE.EMPLOYEE_TYPE' | translate }}<sup>*</sup><b>:</b></label>
                <div class="col-md-8">
                  <input required value="" class="form-control" maxlength="30"
                                               [(ngModel)]="CurrentEmployeeType.EmployeeTypeName"
                                               formControlName="EmployeeTypeName"
                                               type="text" id="Type" [placeholder]="'EMPLOYEE.EMPLOYEE_TYPE' | translate"
                                               (keyup.enter)="FocusElementById('Description')"/>
                  <span class="color-red font-sm" [hidden]="CurrentEmployeeType.IsValidCheck('EmploeeTypeName','required') || !(CurrentEmployeeType.IsDirty('EmploeeTypeName'))">{{ 'EMPLOYEE.ENTER_TYPE_NAME' | translate }}</span> </div>
              </div>
              <div class="form-group">
                <label class="control-label col-md-4">{{ 'EMPLOYEE.DESCRIPTION' | translate }}<b>:</b></label>
                <div class="col-md-8">
                  <input class="form-control"
                                               [(ngModel)]="CurrentEmployeeType.Description" [ngModelOptions]="{standalone: true}"
                                               type="text" id="Description" value="" [placeholder]="'EMPLOYEE.DESCRIPTION' | translate"
                                               (keyup.enter)="FocusElementById('Add')" />
                </div>
              </div>
              <div class="form-group">
                <label class="control-label col-md-4">{{ 'EMPLOYEE.IS_ACTIVE' | translate }} <b>:</b> </label>
                <div class="col-md-8">
                  <div class="input-group">
                    <div class="icheck-inline">
                      <label class="mt-checkbox mt-checkbox-outline">
                        <input id="isActive" name="isActive" type="checkbox" value=""
                                                           [(ngModel)]="CurrentEmployeeType.IsActive"
                                                           [ngModelOptions]="{standalone: true}">
                        <span></span> </label>
                    </div>
                  </div>
                </div>
              </div>              
            </div>
			  <div class="panel-footer">
                <input type="button" class="btn green btn-success margin-7-hr" *ngIf="!update" (click)="Add()" [value]="'EMPLOYEE.ADD' | translate" id="Add" />
                <input type="button" class="btn green btn-success margin-7-hr" *ngIf="update" (click)="Update()" [value]="'EMPLOYEE.UPDATE' | translate" id="Add"/>
              </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
