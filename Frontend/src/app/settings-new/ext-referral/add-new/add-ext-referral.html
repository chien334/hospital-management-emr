<div class="popup-static portlet box portlet-fullscreen custom_modal">
  <div class="portlet-body form">
    <div class="row">
      <div class="col-md-4 col-md-offset-4">
        <div class="modelbox-div ref_modal_div clearfix">
          <div class="caption custom-caption no-margin">
            <h3>
              <span>
                <ng-container *ngIf="isAddNewRef">{{ 'SETTINGS_NEW.ADD_EXTERNAL_REFERRAL' | translate }}</ng-container>
                <ng-container *ngIf="!isAddNewRef">{{ 'SETTINGS_NEW.EDIT_EXTERNAL_REFERRAL' | translate }}</ng-container>
              </span>
            </h3>
            <a class="btn btn-danger" (click)="close()">X</a>
          </div>
          <form [formGroup]="externalRef.ExternalRefValidator" class="form-horizontal hm-form externalForm">
            <div class="form-body">
              <div class="form-group">
                <label for="referrerName" class="control-label col-md-5">{{ 'SETTINGS_NEW.REFERRER_NAME' | translate }}<sup>*</sup><b>:</b></label>
                <div class="col-md-7">
                  <input id="referrerName" class="form-control" type="text" [placeholder]="'SETTINGS_NEW.REFERRER_NAME' | translate"
                         formControlName="ReferrerName" [(ngModel)]="externalRef.ReferrerName"
                         (keyup.enter)="SetFocusById('ExtRefferaddress')">
                  <span class="color-red font-sm margin-15-lft"
                        [hidden]="!(externalRef.IsDirty('ReferrerName') && !externalRef.IsValidCheck('ReferrerName','required'))">{{ 'SETTINGS_NEW.REFERRER_NAME' | translate }} is
                    required</span>

                </div>
              </div>
              <div class="form-group">
                <label for="address" class="control-label col-md-5">{{ 'GRID_HEADERS.ADDRESS' | translate }} <b>:</b></label>
                <div class="col-md-7">
                  <input type="text" id="ExtRefferaddress" class="form-control" [placeholder]="'GRID_HEADERS.ADDRESS' | translate"
                         [ngModelOptions]="{standalone: true}" [(ngModel)]="externalRef.ContactAddress"
                         (keyup.enter)="SetFocusById('contactNum')">
                </div>
              </div>
              <div class="form-group">
                <label for="contactNum" class="control-label col-md-5">{{ 'SETTINGS_NEW.CONTACT_NUMBER' | translate }}<b>:</b></label>
                <div class="col-md-7">
                  <input id="contactNum" class="form-control" type="number" [placeholder]="'SETTINGS_NEW.CONTACT_NUMBER' | translate"
                         formControlName="ContactNumber" [(ngModel)]="externalRef.ContactNumber" maxlength="15"
                         (keyup.enter)="SetFocusById('panNum')">
                  <span class="color-red font-sm" *ngIf="externalRef.IsDirty('ContactNumber')"
                        [hidden]="externalRef.IsValidCheck('ContactNumber','pattern')">{{ 'SETTINGS_NEW.PLEASE_ENTER_VALID_CONTACT_NUMBER' | translate }}</span>
                </div>
              </div>
              <div class="form-group">
                <label for="email" class="control-label col-md-5">{{ 'GRID_HEADERS.EMAIL' | translate }}<b>:</b></label>
                <div class="col-md-7">
                  <input id="email" class="form-control" type="email" [placeholder]="'GRID_HEADERS.EMAIL' | translate"
                         formControlName="EmailAddress" [(ngModel)]="externalRef.EmailAddress" (keyup.enter)="SetFocusById('panNum')">
                </div>
                <span class="color-red font-sm margin-15-lft"
                      [hidden]="!(externalRef.IsDirty('EmailAddress') && !externalRef.IsValidCheck('EmailAddress','pattern'))">Eg:
                  abc&#64;gmail.com</span>
              </div>
              <div class="form-group">
                <label for="referrerName" class="control-label col-md-5">{{GeneralFieldLabel.PANNo}}<b>:</b></label>
                <div class="col-md-7">
                  <input class="form-control" type="text"
                         onClick="this.select();" placeholder="{{GeneralFieldLabel.PANNo}}"
                         [(ngModel)]="externalRef.PANNumber"
                         [ngModelOptions]="{standalone: true}"
                         id="panNum" (keyup.enter)="SetFocusById('NMCNum')">
                </div>
              </div>
              <div class="form-group">
                <label for="NMCNumber" class="control-label col-md-5">{{GeneralFieldLabel.NMCNo}}<b>:</b></label>
                <div class="col-md-7">
                  <input class="form-control" type="text"
                         onClick="this.select();" placeholder="{{GeneralFieldLabel.NMCNo}}"
                         [(ngModel)]="externalRef.NMCNumber"
                         [ngModelOptions]="{standalone: true}"
                         id="NMCNum" (keyup.enter)="SetFocusById('add')">
                </div>
              </div>
              <div class="form-group">
                <label for="referrerName" class="control-label col-md-5">{{ 'SETTINGS_NEW.TDS_PERCENT' | translate }}<b>:</b></label>
                <div class="col-md-7">
                  <input class="form-control" type="number"
                         onClick="this.select();"
                         [(ngModel)]="externalRef.TDSPercent"
                         [ngModelOptions]="{standalone: true}">
                </div>
              </div>
              <div class="form-group">
                <label for="IsIncentiveApplicable" class="control-label col-md-5">{{ 'SETTINGS_NEW.IS_INCENTIVE_APPLICABLE' | translate }}</label>
                <div class="col-md-7">
                  <div class="input-group">
                    <div class="icheck-inline">
                      <label class="mt-checkbox mt-checkbox-outline">
                        <input id="IsIncentiveApplicable" name="IsIncentiveApplicable"
                               type="checkbox" value=""
                               [(ngModel)]="externalRef.IsIncentiveApplicable"
                               [ngModelOptions]="{standalone: true}">
                        <span></span>
                        {{ 'SETTINGS_NEW.TRUE' | translate }}
                      </label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label for="isActive" class="control-label col-md-5">{{ 'GRID_HEADERS.IS_ACTIVE' | translate }}</label>
                <div class="col-md-7">
                  <div class="input-group">
                    <div class="icheck-inline">
                      <label class="mt-checkbox mt-checkbox-outline">
                        <input id="isActive" type="checkbox"
                               [ngModelOptions]="{standalone: true}" [(ngModel)]="externalRef.IsActive" name="chkIsActive" />
                        <span></span>
                        {{ 'SETTINGS_NEW.TRUE' | translate }}
                      </label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </form>

          <div class="modelbox-footer">
            <div class="all-buttons text-right">
              <button id="add" *ngIf="isAddNewRef" class="btn green btn-success margin-7-hr" (click)="AddReferral()">{{ 'SETTINGS_NEW.ADD' | translate }}</button>
              <button id="add" *ngIf="!isAddNewRef" class="btn green btn-success margin-7-hr" (click)="UpdateReferral()">{{ 'COMMON.UPDATE' | translate }}</button>
              <!-- <button type="button" class="btn btn-danger btn-sm margin-7-hr" (click)="close()">Close</button> -->
            </div>
          </div>

          <!-- <div class="close-modelbox">
            <button class="btn btn-danger" (click)="close()">X</button>
          </div> -->


        </div>
      </div>

    </div>

  </div>
</div>
