<div class="row">
  <div class="form-body">
    <div class="col-md-12">
      <div class="row">
        <div class="col-md-12">
          <div class="caption custom-caption no-margin"> <i class="glyphicon glyphicon-asterisk"></i> <span class="caption-subject">{{ 'PHARMACY.STOCK_ITEMS_REPORT' | translate }}</span> </div>
        </div>
        <div class="col-md-12 col-xs-12">
          <div class="row mt10">
            <div class="col-md-4">
              <div class="row">
                <label class="control-label col-md-4">{{ 'PHARMACY.SELECT_ITEM' | translate }}<b class="color-red"> *</b><b style="float:right;">:</b></label>
                <div class="col-md-8">
                  <div class="form-group no-margin">
                    <input dsf-auto-complete class="form-control"
                                   [(ngModel)]="selectedItem"
                                   [source]="itemList"
                                   [list-formatter]="myItemListFormatter"
                                   [placeholder]="'PHARMACY.SELECT_ITEM' | translate"
                                   display-property-name="ItemName"
                                   value-property-name=null
                                   onClick="this.select();"
                                   (valueChanged)="onChangeItem($event)"
                                   max-num-list="10"
                                   (focusout)="CheckProperSelectedItem()"
                                   min-chars="0"
                                   style="width:100%;" />
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-4 col-xs-12">
              <div class="row">
                <label class="control-label col-md-4">{{ 'PHARMACY.SELECT_LOCATION' | translate }}<b style="float:right;">:</b></label>
                <div class="col-md-8">
                  <select style="width:100%;height:32px" [(ngModel)]="selectedLocation">
                    <option value="1" selected>{{ 'PHARMACY.DISPENSARY' | translate }}</option>
                    <option value="2" >{{ 'GRID_HEADERS.STORE' | translate }}</option>
                    <option value="3" >{{ 'PHARMACY.WARD' | translate }}</option>
                    <option value="0" >{{ 'PHARMACY.ALL' | translate }}</option>
                  </select>
                </div>                
              </div>
            </div>
            <div class="col-md-4 col-xs-12">
              <div class="form-group">
                <button class="btn blue" type="button" (click)="GetReportData()"> <i class="fa fa-search"></i> {{ 'PHARMACY.SHOW_REPORT' | translate }} </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="row">
  <div class="col-lg-12 col-sm-12">
    <dsf-grid [grid-colDefaults]="PHRMStockItemsReportColumns"
                        [grid-data]="PHRMStockItemsReportData"
                        [grid-exportOptions]="gridExportOptions"
                        [grid-showExport]="true"
                        (grid-onExport)="OnGridExport($event)" 
                        [report-for]="pharmacy"> </dsf-grid>
  </div>
</div>
<div class="row">
  <table style="float:right; margin-right:20px;">
    <tr></tr>
    <tr> 
      
      <!-- <td><b>Total Quantity: </b></td> <td>{{totalQuantity}}</td> -->
      <td style="width:40px;"></td>
      <!-- <td><b>Total Amount:</b></td><td>{{totalAmount}}</td> -->
      <td style="width:80px;"></td>
    </tr>
  </table>
</div>
