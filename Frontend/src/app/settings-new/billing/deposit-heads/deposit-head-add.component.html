<div class="popup-static portlet box portlet-fullscreen custom_modal" *ngIf="showAddPage">
    <div class=" portlet-body form">
        <div class="row">
            <div class="col-md-4 col-md-offset-4">
                <div class="modelbox-div clearfix">
                    <div class="caption custom-caption no-margin">
                        <h3> <span *ngIf="!isUpdate">{{ 'SETTINGS_NEW.ADD_DEPOSIT_HEAD' | translate }}</span>
                            <span *ngIf="isUpdate">{{ 'SETTINGS_NEW.UPDATE_DEPOSIT_HEAD' | translate }}</span>
                        </h3>
                        <a class="btn btn-danger" (click)="Close()" [title]="'COMMON.CANCEL' | translate">X</a>
                    </div>
                    <form class="form-horizontal hm-form">
                        <div class="form-body">
                            <div class="form-group">
                                <label class="control-label col-md-5">{{ 'SETTINGS_NEW.DEPOSIT_HEAD_CODE' | translate }}<sup>*</sup><b>:</b></label>
                                <div class="col-md-7">
                                    <input class="form-control" name="DepositHeadCode"
                                           type="text"
                                           [(ngModel)]="currentDepositHead.DepositHeadCode"
                                           [placeholder]="'SETTINGS_NEW.ENTER_DEPOSIT_HEAD_CODE' | translate" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-md-5">{{ 'SETTINGS_NEW.DEPOSIT_HEAD_NAME' | translate }}<sup>*</sup><b>:</b></label>
                                <div class="col-md-7">
                                    <input class="form-control" name="DepositHeadName"
                                           type="text"
                                           [(ngModel)]="currentDepositHead.DepositHeadName"
                                           [placeholder]="'SETTINGS_NEW.DEPOSIT_HEAD_NAME' | translate" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-md-5">{{ 'GRID_HEADERS.DESCRIPTION' | translate }}<b>:</b></label>
                                <div class="col-md-7">
                                    <textarea id="id_description_depositHeads" name="Description"
                                              [(ngModel)]="currentDepositHead.Description"
                                              rows="2" class="w-100 form-control"></textarea>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-md-5">{{ 'SETTINGS_NEW.DEFAULT_DEPOSIT_HEAD' | translate }}<b>:</b> </label>
                                <div class="col-md-7">
                                    <div class="input-group">
                                        <div class="icheck-inline">
                                            <label class="mt-checkbox mt-checkbox-outline">
                                                <input id="needParent" name="IsDefault"
                                                       [(ngModel)]="currentDepositHead.IsDefault" type="checkbox" />
                                                <span></span> </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                    <div class="panel-footer" style="text-align: right;">
                        <input id="savebtn" type="button" class="btn green btn-success margin-7-hr"
                               *ngIf="!isUpdate"
                               [disabled]="loading" (click)="AddDepositHead()" [value]="'SETTINGS_NEW.ADD' | translate" />
                        <input id="savebtn" type="button" class="btn green btn-success margin-7-hr"
                               *ngIf="isUpdate"
                               [disabled]="loading" (click)="UpdateDepositHead()" [value]="'COMMON.UPDATE' | translate" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
