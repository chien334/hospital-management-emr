<div class="popup-static portlet box portlet-fullscreen inv_modal" *ngIf="showAddPage">
    <div class="portlet-body form">        
            <!-- <div class="col-md-2 hidden-xs hidden-sm" style="margin-right: 24px;">
            </div> -->
            <div class="row">
                <div class="col-md-4 col-md-offset-4">
                    <div class="modelbox-div clearfix">                
                        <div class="caption lb-caption">
                            <h3>
                                <span *ngIf="!update">{{ 'INVENTORY.ADD_CURRENCY' | translate }}</span>
                                <span *ngIf="update">{{ 'INVENTORY.UPDATE_CURRENCY' | translate }}</span>
                            </h3>
                            <a class="btn btn-danger" (click)="Close()" [title]="'COMMON.CANCEL' | translate">X</a>
                        </div>                      
                                  
                    <form [formGroup]="CurrentCurrency.CurrencyValidator" class="form-horizontal hm-form">
                        <div class="form-body">                            
                                <div class="form-group">
                                    <label class="control-label col-md-5">{{ 'INVENTORY.CURRENCY_CODE' | translate }}<sup class="color-red">*</sup><b>:</b></label>
                                    <div class="col-md-7">
                                        <input class="form-control" maxlength="30" type="text"
                                               [(ngModel)]="CurrentCurrency.CurrencyCode"
                                               formControlName="CurrencyCode"
                                               id="CurrencyCode"
                                               [placeholder]="'INVENTORY.CURRENCYCODE' | translate"
                                               (keyup.enter)="FocusElementById('AddCurrency')"  />
                                        <span class="color-red font-sm" [hidden]="CurrentCurrency.IsValidCheck('CurrencyCode','required') || !(CurrentCurrency.IsDirty('CurrencyCode'))">{{ 'INVENTORY.CURRENCYCODE_IS_REQUIRED' | translate }}</span>
                                        <span class="color-red font-sm" *ngIf="CurrentCurrency.IsDirty('CurrencyCode')" [hidden]="CurrentCurrency.IsValidCheck('CurrencyCode','maxlength')"> {{ 'INVENTORY.LENGTH_IS_NOT_PROPER' | translate }}</span>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="control-label col-md-5">{{ 'GRID_HEADERS.DESCRIPTION' | translate }}<b>:</b></label>
                                    <div class="col-md-7">
                                        <input class="form-control" maxlength="200" type="text"
                                               [(ngModel)]="CurrentCurrency.Description"
                                               [ngModelOptions]="{standalone: true}"
                                               id="Description"
                                               [placeholder]="'GRID_HEADERS.DESCRIPTION' | translate" />
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="control-label col-md-5">{{ 'GRID_HEADERS.IS_ACTIVE' | translate }} <b>:</b> </label>
                                    <div class="col-md-7">
                                        <div class="input-group">
                                            <div class="icheck-inline">
                                                <label class="mt-checkbox mt-checkbox-outline">
                                                    <input id="isActive"
                                                           type="checkbox"
                                                           [(ngModel)]="CurrentCurrency.IsActive"
                                                           [ngModelOptions]="{standalone: true}" />
                                                    <span></span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <input type="button" class="btn green btn-success margin-7-hr" *ngIf="!update" (click)="AddCurrency()" [value]="'INVENTORY.ADD_CURRENCY' | translate" [disabled]="loading" id="AddCurrency" />
                                    <input type="button" class="btn green btn-success margin-7-hr" *ngIf="update" (click)="Update()" [value]="'COMMON.UPDATE' | translate" [disabled]="loading" id="AddCurrency" />
                                </div>
                        </div>
                    </form>
                </div>
                </div>
            </div>           
        
    </div>
</div>
