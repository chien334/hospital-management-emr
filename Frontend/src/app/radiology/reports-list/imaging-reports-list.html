<div class="wrapper">
  <div class="flex-container flex-align-center margin-15-bt margin-5-tp">
    <div class="flex-1">
      <div class="caption"> <i class="glyphicon glyphicon-asterisk font-green-turquoise"></i> <span class="caption-subject font-blue-sharp bold uppercase">{{ 'RADIOLOGY.IMAGING_REPORTS_OF_ALL_PATIENTS' | translate }}</span> </div>
    </div>
    <div class="flex-1 text-right">
      <div>
        <b>{{ 'RADIOLOGY.FILTER' | translate }}</b>
        <imaging-type-selector (inputModelChange)="ImagingTypeDropdownOnChange($event)"></imaging-type-selector>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-lg-12 col-sm-12">
      <dsf-view-imaging-report *ngIf="showImagingReport" (on-report-edit)="GetBackOnClose($event)" [requisitionId]="requisitionId"></dsf-view-imaging-report>
      <dsf-grid [grid-colDefaults]="imgReportsListGridColumns" [grid-data]="allImagingFilteredReports" [rangeType]="dateRange" (onDateChange)="onDateChange($event)" [date-range-options]="'1W,1M,3M'" [show-CustomDate]="true" [show-print-button]="true" (grid-actions)="ImagingReportListGridActions($event)" [NepaliDateInGridParams]="NepaliDateInGridSettings" [grid-exportOptions]="gridExportOptions" [grid-showExport]="true" [report-header]="'IMAGING REPORTS OF ALL PATIENTS'"> </dsf-grid>
    </div>
  </div>
</div>
