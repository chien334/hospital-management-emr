<div class="popup-static portlet box portlet-fullscreen inv_modal" *ngIf="!showsectionList">
  <div class="portlet-body form">
    <div class="row">
      <div class="col-md-4 col-md-offset-4">
        <div class="modelbox-div clearfix">
          <div class="caption lb-caption">
            <h3> <span  *ngIf="!edit">{{ 'ACCOUNTING.ADD_SECTION' | translate }}</span> <span   *ngIf="edit">{{ 'ACCOUNTING.UPDATE_SECTION' | translate }}</span> </h3>
            <a class="btn btn-danger" (click)="Close()" [title]="'COMMON.CANCEL' | translate"><i class="fa fa-times"></i></a> 
			</div>
          <form [formGroup]="selectedSection.SectionValidator" class="form-horizontal hm-form">
            <div class="form-body">
              
                <!--
          <div class="col-md-3 hidden-xs hidden-sm" style="margin-right:24px;">
          </div>
-->
                <div class="form-group">
                  <label class="control-label col-md-5">{{ 'ACCOUNTING.SECTION_CODE' | translate }}<b>:</b></label>
                  <div class="col-md-7">
                    <input class="form-control" maxlength="30" [(ngModel)]="selectedSection.SectionCode"
                    [ngModelOptions]="{standalone: true}" (ngModelChange)="CapitalizeSectionCode()" type="text"
                      id="SectionCode" value="" [placeholder]="'ACCOUNTING.SECTION_CODE' | translate" />
                    <br />
                    <!-- <span class="color-red font-sm" style="color:red"
                      [hidden]="selectedSection.IsValidCheck('SectionCode','required') || !(selectedSection.IsDirty('SectionCode'))">Section
                      Code required </span> --> 
                  </div>
                </div>
                <div class="form-group">
                  <label class="control-label col-md-5">{{ 'ACCOUNTING.SECTION_ID' | translate }}<sup>*</sup><b>:</b></label>
                  <div class="col-md-7">
                    <input *ngIf ="!edit" class="form-control" maxlength="30" [(ngModel)]="selectedSection.SectionId"
                      formControlName="SectionId" type="text" id="SectionId" value="" [placeholder]="'ACCOUNTING.SECTION_ID' | translate" />
                    <input *ngIf ="edit" disabled class="form-control" maxlength="30" [(ngModel)]="selectedSection.SectionId"
                      formControlName="SectionId" type="text" id="SectionId" value="" [placeholder]="'ACCOUNTING.SECTION_ID' | translate" />
                    <br />
                    <span class="color-red font-sm" style="color:red"
                      [hidden]="selectedSection.IsValidCheck('SectionId','required') || !(selectedSection.IsDirty('SectionId'))">{{ 'ACCOUNTING.SECTION_ID_REQUIRED' | translate }}</span> </div>
                </div>
                <div class="form-group">
                  <label class="control-label col-md-5">{{ 'ACCOUNTING.SECTION_NAME' | translate }}<sup>*</sup><b>:</b></label>
                  <div class="col-md-7">
                    <input class="form-control" maxlength="30" type="text" [(ngModel)]="selectedSection.SectionName"
                      formControlName="SectionName" id="SectionName" [placeholder]="'ACCOUNTING.SECTION_NAME' | translate" />
                    <span class="color-red font-sm"
                      [hidden]="selectedSection.IsValidCheck('SectionName','required') || !(selectedSection.IsDirty('SectionName'))">{{ 'ACCOUNTING.SECTION_NAME_REQUIRED' | translate }}</span> </div>
                </div>
                <div class="form-actions">
                  <input type="button" class="btn btn-primary primary-btn" *ngIf="!edit"  (click)="SavenewSection()" [value]="'ACCOUNTING.ADD_SECTION' | translate" />
                  <input type="button" class="btn btn-primary" *ngIf="edit"  (click)="UpdateSection()" [value]="'ACCOUNTING.UPDATE_SECTION' | translate" />
                </div>
              
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- <div *ngIf="showsectionList"> <a class="btn blue bordered" style="background-color:#337ab7;" name="name" (click)="AddSection()"> <span class="glyphicon glyphicon-plus"></span>Create Section </a> </div> -->
<div class="row" *ngIf="showsectionList">
  <div class="col-md-12 col-xs-12 col-sm-12">
    <danphe-grid [grid-colDefaults]="sectionGridColumns" [grid-data]="sectionList"
    (grid-actions)="SectionGridActions($event)"> </danphe-grid>
  </div>
</div>
