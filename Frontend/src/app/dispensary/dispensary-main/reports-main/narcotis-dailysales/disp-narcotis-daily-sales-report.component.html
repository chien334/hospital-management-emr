<div class="row">
    <div class="form-body">
        <div class="col-md-12">
            <div class="col-md-12">
                <div class="caption custom-caption" style="float: left;">
                    <i class="glyphicon glyphicon-asterisk"></i>
                    <span class="caption-subject">{{ 'DISPENSARY.REPORTS.NARCOTICS_DAILY_SALES' | translate }}</span>
                </div>
                <div style="float: right; font-size: 11px;">
                    {{ 'DISPENSARY.REPORTS.NARCOTICS_NOTE' | translate }}
                </div>
            </div>
        </div>
        <div class="col-md-12">
            <div class="col-md-6">
                <from-to-date-select (on-change)="OnFromToDateChange($event)" [date-settings-name]="'billing-reports'">
                </from-to-date-select>
            </div>
            <div class="col-md-4 col-xs-12">
                <div class="form-group row">
                    <label class="control-label col-md-5">{{ 'DISPENSARY.REPORTS.SELECT_DISPENSARY' | translate }}<b style="float:right;">:</b></label>
                    <div class="col-md-7">
                        <input dsf-auto-complete [(ngModel)]="selectedDispensary" class="form-control"
                            [list-formatter]="DispensaryListFormatter" [source]="dispensaryList"
                            [placeholder]="'DISPENSARY.REPORTS.SELECT_DISPENSARY' | translate" display-property-name="Name" value-property-name=null
                            onclick="this.select();" id="dispensary" (valueChanged)="OnDispensaryChange()"
                            max-num-list="10" [ngModelOptions]="{standalone: true}" />
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-12 mt10">
            <div class="row">
                <div class="col-md-5 col-xs-12">
                    <div class="row"><label class="control-label col-md-4">{{ 'DISPENSARY.REPORTS.SELECT_ITEM' | translate }}<b class="color-red"> *</b><b
                                style="float:right;">:</b></label>
                        <div class="col-md-8">
                            <div class="form-group">
                                <input dsf-auto-complete class="form-control" [(ngModel)]="selectedItem"
                                    [source]="itemList" [list-formatter]="myItemListFormatter"
                                    [placeholder]="'DISPENSARY.REPORTS.SELECT_ITEM_PLACEHOLDER' | translate" display-property-name="ItemName"
                                    value-property-name=null onClick="this.select();"
                                    (valueChanged)="onChangeItem($event)" max-num-list="10"
                                    (focusout)="CheckProperSelectedItem()" min-chars="0" style="width:100%;" />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 col-xs-12">
                    <div class="form-group">
                        <button class="btn blue" type="button" (click)="GetReportData()" [disabled]="loading">
                            <span *ngIf="!loading">{{ 'DISPENSARY.REPORTS.SHOW_REPORT' | translate }}</span>
                            <span *ngIf="loading">{{ 'DISPENSARY.REPORTS.LOADING' | translate }}</span>
                         </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-lg-12 col-sm-12">
        <dsf-grid [grid-colDefaults]="NarcoticsDailySalesSummaryReportColumns"
            [NepaliDateInGridParams]="NepaliDateInGridSettings" [grid-data]="NarcoticsDailySalesSummaryReportData"
            [grid-exportOptions]="gridExportOptions" [grid-showExport]="true">
        </dsf-grid>
    </div>
</div>
