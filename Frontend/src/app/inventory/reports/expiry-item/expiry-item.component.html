<div class="row">
  <div class="col-md-12">
    <div class="caption custom-caption no-margin"> <i class="glyphicon glyphicon-asterisk"></i> <span class="caption-subject">{{ 'INVENTORY.EXPIRY_ITEM_REPORT' | translate }}</span> </div>
  </div>
</div>

<div class="row">
  <div class="col-lg-12 col-sm-12">
    <div class="col-md-12">
      <div>
        <table class="table billing-table" style="background-color:initial;margin-bottom:0px;">
          <thead>
            <tr>
              <th><b class="align">{{ 'INVENTORY.FROM_DATE' | translate }}<sup>*</sup></b></th>
              <th><b class="align">{{ 'INVENTORY.TO_DATE' | translate }}<sup>*</sup></b></th>
              <th><b class="align">{{ 'INVENTORY.ITEM' | translate }} {{ 'COMMON.NAME' | translate }}</b></th>
              <th><b class="align">{{ 'INVENTORY.SUB_STORE' | translate }}</b></th>
            </tr>
          </thead>
          <tbody style="background-color: #dde3e9;">
            <tr>
              <td style="width: 200px;">
                <dsf-date-picker [(ngModel)]="fromDate" ngDefaultControl [CalendarTypes]="'en,np'"> </dsf-date-picker>
              </td>
              <td style="width: 200px;">
                <dsf-date-picker [(ngModel)]="toDate" ngDefaultControl [CalendarTypes]="'en,np'" [allow-future-date]="true"> </dsf-date-picker>
              </td>
              <td style="width: 250px;">
                <select name="SelectedItem" id="SelectedItem" [(ngModel)]="ItemId" (ngModelChange)="OnItemChange()" class="form-control">
                  <option [ngValue]="null" selected>{{ 'INVENTORY.ALL_ITEMS' | translate }}</option>
                  <option *ngFor="let item of ItemList" [ngValue]="item.ItemId">
                    {{item.ItemName}}</option>
                </select>
              </td>
              <td style="width: 250px;">
                <select [(ngModel)]="StoreId" class="form-control" (ngModelChange)="OnStoreChange()">
                  <option [ngValue]="null" selected>{{ 'INVENTORY.ALL_STORE' | translate }}</option>
                  <option *ngFor="let store of subStoreList" [ngValue]="store.StoreId">{{store.Name}}</option>
                </select>
              </td>
              <td></td>
              <td>
                <button class="btn btn-primary btn-add-new-row" (click)="GetReportData()">{{ 'INVENTORY.SHOW_REPORT' | translate }}
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div>
        <dsf-grid [grid-colDefaults]="expiryItemGridColumns" [grid-data]="expiryItemData" [grid-exportOptions]="gridExportOptions" [grid-showExport]="true" [report-for]="'inventory'" (onDateChange)="OnDateRangeChange($event)" [report-title]="'Expiry Item Report'" [report-for]="'inventory'" [show-header]="true" [filter-parameters]="FilterParameters" [NepaliDateInGridParams]="NepaliDateInGridSettings">
        </dsf-grid>
      </div>
    </div>
  </div>
</div>
