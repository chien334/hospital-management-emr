<form class="form-horizontal hm-form">
  <div class="form-body">
    <div class="caption lb-caption">
      <i class="fa fa-money"></i>
      <span class="caption-subject">{{ 'INVENTORY.SUPPLIER_WISE_STOCK' | translate }} </span>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="col-md-8">
          <fiscal-year-calendar [showSingleDatePicker]="false" [showAllFiscalYear]="true" (fiscalYearDate)="selectDate($event)"> </fiscal-year-calendar>
        </div>
        <div class="form-group">
          <button class="btn blue primary-btn" type="button" style="float: right !important;margin-right:10% !important" (click)="Load()"> {{ 'INVENTORY.SHOW_REPORT' | translate }}</button>
        </div>
      </div>
    </div>
  </div>

  <div class="col-md-6 col-xs-12">
    <div class="form-group">
      <label class="control-label col-md-4">{{ 'INVENTORY.SELECT_VENDOR' | translate }} <b style="float:right;">:</b></label>
      <div class="col-md-7">
        <input class="form-control" danphe-auto-complete [(ngModel)]="selVendor" [ngModelOptions]="{standalone: true}" [list-formatter]="VendorListFormatter" [source]="vendorList" [placeholder]="'INVENTORY.ENTER_VENDOR_NAME' | translate" display-property-name="VendorName" value-property-name="VendorId" max-num-list="10" (focusout)="vendorChanged()" />
      </div>
    </div>
    <div class="form-group">
      <label class="control-label col-md-4">{{ 'INVENTORY.SELECT_STORE' | translate }} <b style="float:right;">:</b></label>
      <div class="col-md-7">
        <input class="form-control" danphe-auto-complete [(ngModel)]="selStore" [ngModelOptions]="{standalone: true}" [list-formatter]="StoreListFormatter" [source]="storeList" [placeholder]="'INVENTORY.ENTER_STORE_NAME' | translate" display-property-name="Name" value-property-name="StoreId" max-num-list="10" (focusout)="storeChanged()" />
      </div>
    </div>
  </div>
  <div class="col-md-6 col-xs-12">
    <div class="form-group">
      <label class="control-label col-md-4">{{ 'INVENTORY.SELECT_ITEM' | translate }} <b style="float:right;">:</b></label>
      <div class="col-md-7">
        <input class="form-control" danphe-auto-complete [(ngModel)]="selItem" [ngModelOptions]="{standalone: true}" [list-formatter]="ItemListFormatter" [source]="itemsList" [placeholder]="'INVENTORY.ENTER_ITEM_NAME' | translate" display-property-name="ItemName" value-property-name="ItemId" max-num-list="10" (focusout)="itemChanged()" />
      </div>
    </div>
  </div>
</form>

<div class="row">
  <div class="col-lg-12 col-sm-12">
    <danphe-grid [grid-colDefaults]="supplierWiseStockReportColumns" [grid-data]="supplierWiseStockReportGridData" [grid-exportOptions]="gridExportOptions" [grid-showExport]="true" [show-header]="true" [report-for]="'inventory'" [report-title]="'Supplier Wise Stock Report'" [filter-parameters]="FilterParameters">
    </danphe-grid>
  </div>
</div>
