<button class="btn btn-primary" (click)="Back()">{{ 'COMMON.BACK' | translate }}</button>

<div class="row">

  <form [formGroup]="currentdiagnosiswisepatient.DiagnosisWisePatientReportValidator" class="hm-form clearfix">
    <div class="form-body">
      <div class="col-md-12">
        <div class="caption custom-caption">

          <i class="glyphicon glyphicon-asterisk"></i>
          <span class="caption-subject">{{ 'MEDICAL_RECORDS.DIAGNOSIS_WISE_PATIENT_REPORT' | translate }}</span>
        </div>

        
      </div>
		<div class="col-md-12">
			<div class="row"><div class="col-md-3 col-xs-12">
          <div class="form-group">
            <label class="control-label col-md-3">{{ 'COMMON.FROM_DATE' | translate }}<b class="color-red">  *</b><b style="float:right;">:</b></label>
            <div class="col-md-9">
              <danphe-date-picker [(ngModel)]="currentdiagnosiswisepatient.fromDate" ngDefaultControl [CalendarTypes]="'en,np'" formControlName="fromDate">
              </danphe-date-picker>


              <span class="color-red font-sm" *ngIf="currentdiagnosiswisepatient.IsDirty('fromDate')" [hidden]="currentdiagnosiswisepatient.IsValidCheck('fromDate','required')">{{ 'COMMON.FROM_DATE_IS_REQUIRED' | translate }}</span><br />
              <span class="color-red font-sm" *ngIf="currentdiagnosiswisepatient.IsDirty('fromDate')" [hidden]="currentdiagnosiswisepatient.IsValidCheck('fromDate','wrongDate')">{{ 'COMMON.ENTER_VALID_DATE' | translate }}</span>

            </div>
          </div>

        </div>
        <div class="col-md-3 col-xs-12">
          <div class="form-group">
            <label class="control-label col-md-3">{{ 'COMMON.TO_DATE' | translate }}<b class="color-red">  *</b><b style="float:right;">:</b></label>
            <div class="col-md-9">
              <danphe-date-picker [(ngModel)]="currentdiagnosiswisepatient.toDate" ngDefaultControl [CalendarTypes]="'en,np'" formControlName="toDate">
              </danphe-date-picker>
              <span class="color-red font-sm" *ngIf="currentdiagnosiswisepatient.IsDirty('toDate')" [hidden]="currentdiagnosiswisepatient.IsValidCheck('toDate','required')">{{ 'COMMON.TO_DATE_IS_REQUIRED' | translate }}</span><br />
              <span class="color-red font-sm" *ngIf="currentdiagnosiswisepatient.IsDirty('toDate')" [hidden]="currentdiagnosiswisepatient.IsValidCheck('toDate','wrongDate')">{{ 'COMMON.CANT_SELECT_FUTURE_DATE' | translate }}</span>

            </div>
          </div>

        </div>
		<div class="col-md-4 col-xs-12">
          <div class="form-group">
            <label class="control-label col-md-5">{{ 'MEDICAL_RECORDS.DIAGNOSIS_NAME' | translate }}<b style="float:right;">:</b></label>
            <div class="col-md-7">

              <input class="form-control" danphe-auto-complete
                     [(ngModel)]="selDiagnosis"
                     [ngModelOptions]="{standalone: true}"
                     [list-formatter]="myListFormatter"
                     [source]="diagnosisList"
                     [placeholder]="'MEDICAL_RECORDS.ENTER_DIAGNOSIS_NAME' | translate"
                     display-property-name="Diagnosis"
                     value-property-name=null
                     (focusout)="diagnosisChanged()">

            </div>
          </div>
        </div>
		  <div class="col-md-2 col-xs-12">
          <div class="form-group">
            <button class="btn blue" type="button" (click)="Load()" [disabled]="!(currentdiagnosiswisepatient.IsValid())">
              <i class="fa fa-search"></i>
              {{ 'COMMON.SHOW_REPORT' | translate }}
            </button>
          </div>
        </div></div>
		</div>
      

    </div>


  </form>

</div>

<div class="row">
  <div class="col-lg-12 col-sm-12" *ngIf="DiagnosisWisePatientReportData.length>0">
    <danphe-grid [grid-colDefaults]="DiagnosisWisePatientReportColumns"
                 [grid-data]="DiagnosisWisePatientReportData"
                 [grid-exportOptions]="gridExportOptions" [grid-showExportNew]="true" (grid-onExport)="OnGridExport($event)">
    </danphe-grid>
  </div>
</div>
