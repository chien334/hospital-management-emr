<div class="well ipd-title" style="margin-bottom: 0px;">
  <div class="row clearfix">
    <div class="col-md-4 col-sm-6">
      <div class="left">
        <a class="label label-primary btn btn-primary" data-bs-toggle="collapse" href="#Collapse1" role="button" aria-expanded="false" aria-controls="Collapse1" style="margin-right: 15px;"> <i class="fa fa-star"></i> {{ 'OPD.MY_FAVORITES' | translate }}</a>
      </div>

      <div class="middle">
        <a class="label label-primary btn btn-primary" data-bs-toggle="collapse" href="#Collapse2" role="button" aria-expanded="false" aria-controls="Collapse2"><i class="fa fa-file-text" style="margin-right: 5px;"></i>
          {{ 'OPD.FOLLOW_UP_LIST' | translate }}</a>
      </div>
    </div>
  </div>
</div>

<div class="collapse" id="Collapse1">
  <div class="tabbable-custom">
    <div class="tab-content">

      <danphe-grid [grid-colDefaults]="OPFavoritePatientGridColumns" [grid-data]="FavoritePatients" (grid-actions)="DocAppointmentGridActions($event)"> </danphe-grid>

    </div>
  </div>
</div>

<div class="collapse" id="Collapse2">
  <div class="tabbable-custom">
    <div class="tab-content">
      <danphe-grid [grid-colDefaults]="OPFollowUpPatientGridColumns" [grid-data]="FollowUpPatients" (grid-actions)="DocAppointmentGridActions($event)"> </danphe-grid>

    </div>
  </div>
</div>

<div class="row">
  <div class="tabbable-custom">
    <div class="tab-content hm-form">
      <div class="tab-pane active" id="visitType">

        <div class="panel panel-default no-border panel_title">
        </div>

        <danphe-cust-date (onDateChange)="onDateChange($event)" [rangeType]="dateRange"></danphe-cust-date>
        <danphe-grid [grid-colDefaults]="DoctorOPNewPatientGridColumns" [grid-data]="FilteredOPDPatientGridData" (grid-actions)="DocAppointmentGridActions($event)"> </danphe-grid>

      </div>
    </div>
  </div>
</div>


<!--POPUP for change doctor-->

<div class="popup-static portlet box portlet-fullscreen" *ngIf="showAssignToOther">
  <div class="portlet-body form" style="background-color:white">
    <form class="form-horizontal">
      <div class="form-body">
        <div class="col-md-12">
          <div class="col-md-3 hidden-xs hidden-sm" style="margin-right:24px;"> </div>
          <div class="col-md-6 col-sm-12 col-xs-12 modelbox-div" style="margin-right: 24px;">
            <div class="col-md-12">
              <div class="caption" style="color:blue;">
                <h3>{{ 'OPD.RE_ASSIGN_PATIENT' | translate }}</h3>
              </div>
              <a style="float:right;  margin-top:-32px;" class="btn btn-danger" (click)="ClosePopUp()" title="Cancel">X</a>
            </div>
            <div class="col-md-12">
              <label class="control-label col-md-3"> <b>{{ 'PATIENT.FULL_NAME' | translate }}</b><b style="float:right;">:</b> </label>
              <label class="control-label col-md-3">{{currSelectedPatient.PatientName}}</label>
              <label class="control-label col-md-3"><b>{{ 'DISPENSARY.SALE.AGE_SEX' | translate }}</b><b style="float:right;">:</b></label>
              <label class="control-label col-md-3">{{currSelectedPatient.AgeSex}}</label>
              <hr>
            </div>
            <div class="col-md-12">
              <div class="form-group">
                <label class="control-label col-md-5"> <b>{{ 'OPD.CURRENT_DOCTOR' | translate }}</b><b style="float:right;">:</b> </label>
                <div class="col-md-7">
                  <input class="form-control" type="text" [(ngModel)]="currSelectedPatient.ProviderName" [ngModelOptions]="{standalone: true}" disabled />
                </div>
              </div>
              <div class="form-group">
                <label class="control-label col-md-5"> <b>{{ 'OPD.NEW_ASSIGNEE' | translate }}</b><b class="color-red">*</b><b style="float:right;">:</b> </label>
                <div class="col-md-7">
                  <select class="form-control" [(ngModel)]="newAssignee" [ngModelOptions]="{standalone: true}">
                    <option *ngFor="let doc of deptProviderList" value="{{doc.EmployeeId}}"> {{doc.ProviderName}}
                    </option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label class="control-label col-md-5"> <b>{{ 'COMMON.REMARKS' | translate }}</b><b class="color-red">*</b><b style="float:right;">:</b> </label>
                <div class="col-md-7">
                  <input class="form-control" maxlength="100" type="text" [(ngModel)]="currSelectedPatient.Remark" [ngModelOptions]="{standalone: true}" placeholder="remark" />
                </div>
              </div>
              <div class="form-actions">
                <input type="button" class="btn btn-primary" (click)="AssignToOther()" value="{{ 'COMMON.SUBMIT' | translate }}" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
