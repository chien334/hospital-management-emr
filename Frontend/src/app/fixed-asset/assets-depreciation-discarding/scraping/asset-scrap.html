<div class="popup-static portlet box portlet-fullscreen custom_modal">
  <div class="portlet-body form">
    <div class="row clearfix">
      <div class="col-md-6 col-md-offset-3">
        <div class="modelbox-div clearfix">
          <div class="caption custom-caption">
            <h3> <span>{{ (UnScrapAsset ? 'FIXED_ASSETS.CANCEL_ASSET_SCRAPING' : 'FIXED_ASSETS.SCRAPING_ASSET') | translate }}</span></h3>
            <a class="btn btn-danger" (click)="Close()" [title]="'COMMON.CANCEL' | translate">X</a>
          </div>
          <form class="form-horizontal hm-form" [formGroup]="selectedAsset.FAStockValidators">
            <div class="form-body row  clearfix">
              <div class="col-md-12">
                <div class="row clearfix">
                  <div class="col-md-6">
                    <div class="form-group">
                      <label class="control-label col-md-5">{{ 'FIXED_ASSETS.ITEM_CODE' | translate }}<b>:</b></label>
                      <div class="col-md-7">
                        <label>{{selectedAsset?.ItemCode}}</label>
                      </div>
                    </div>
                    <div class="form-group">
                      <label class="control-label col-md-5">{{ 'FIXED_ASSETS.ASSET_NAME' | translate }}<b>:</b></label>
                      <div class="col-md-7">
                        <label>{{selectedAsset?.ItemName}}</label>
                      </div>
                    </div>
                    <div class="form-group">
                      <label class="control-label col-md-5">{{ 'FIXED_ASSETS.BAR_CODE' | translate }}<b>:</b></label>
                      <div class="col-md-7">
                        <label>{{selectedAsset?.BarCodeNumber}}</label>
                      </div>
                    </div>
                    <div class="form-group" [hidden]="UnScrapAsset">
                      <label class="control-label col-md-5">{{ 'FIXED_ASSETS.SCRAP_AMOUNT' | translate }} <sup><strong>*</strong></sup><b>:</b></label>
                      <div class="col-md-7">
                        <input class="form-control" type="number"
                                  [(ngModel)]="selectedAsset.ScrapAmount"
                                  formControlName="ScrapAmount"
                                  [placeholder]="'FIXED_ASSETS.ENTER_SCRAP_AMOUNT_PLACEHOLDER' | translate" rows="4"/>                        
                        <span Class="color-red font-sm" [hidden]="selectedAsset.IsValidCheck('ScrapAmount','required') || !(selectedAsset.IsDirty('ScrapAmount'))">{{ 'FIXED_ASSETS.SCRAP_AMOUNT_REQUIRED' | translate }}</span>

                        <!--selectedAsset.IsValidCheck('DamagedRemarks','required') ||-->
                      </div>
                    </div>
                    <div class="form-group">
                      <label class="control-label col-md-5">{{ 'FIXED_ASSETS.REMARKS' | translate }} <sup><strong>*</strong></sup><b>:</b></label>
                      <div class="col-md-7">
                        <textarea class="form-control" type="text"
                                  [(ngModel)]="selectedAsset.ScrapRemarks"
                                  formControlName="ScrapRemarks"
                                  [placeholder]="'FIXED_ASSETS.ENTER_REMARKS_PLACEHOLDER' | translate" rows="4">
                        </textarea>
                        <span Class="color-red font-sm" [hidden]="selectedAsset.IsValidCheck('ScrapRemarks','required') || !(selectedAsset.IsDirty('ScrapRemarks'))">{{ 'FIXED_ASSETS.REMARKS_REQUIRED' | translate }}</span>

                        <!--selectedAsset.IsValidCheck('DamagedRemarks','required') ||-->
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <dsf-bar-code [barcode-number]="selectedAsset.BarCodeNumber">
                    </dsf-bar-code>
                  </div>
                </div>
              </div>  
            </div>
            <div class="panel-footer text-right col-mg-12">
              <button class="btn primary-btn" (click)="UpdateAssetScrapDetails()" [disabled]="loading?true:null">
                {{ (UnScrapAsset ? 'FIXED_ASSETS.CANCEL_SCRAPING' : 'COMMON.SUBMIT') | translate }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
