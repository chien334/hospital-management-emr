<div class="selectedAssetForEdit row" style="margin-left: 20px; margin-right: 10px;">

  <div class="col-md-4">
    <label for="" style="padding-right: 5px;">{{ 'CSSD.DISINFECTION_METHODS' | translate }}</label>
    <select name="DisinfectionMethod" id="DisinfectionMethod" [(ngModel)]="selectedDisinfectionMethod"
      (change)="OnFiltersChange()">
      <option value="all" selected>{{ 'CSSD.ALL' | translate }}</option>
      <option value="Chemical Disinfection">{{ 'CSSD.CHEMICAL_DISINFECTION' | translate }}</option>
      <option value="Autoclave">{{ 'CSSD.AUTOCLAVE' | translate }}</option>
      <option value="Microwave">{{ 'CSSD.MICROWAVE' | translate }}</option>
      <option value="Other">{{ 'CSSD.OTHER' | translate }}</option>
    </select>
  </div>

  <div class="col-md-4 text-right">
    <strong>{{ 'CSSD.SUBSTORE_COLON' | translate }} &nbsp;&nbsp;</strong>
    <select [(ngModel)]="selectedSubstore" (change)="OnFiltersChange()" style="width:40%!important;">
      <option value="0" selected>{{ 'CSSD.ALL_STORE' | translate }}</option>
      <option *ngFor="let store of substoreList" value="{{store.StoreId}}">{{store.Name}}</option>
    </select>
  </div>
</div>
<div class="col-md-12">
  <dsf-grid [grid-colDefaults]="integratedCssdReportGridColumns" [grid-data]="integratedCssdReportGridData"
    [show-CustomDate]="true" [rangeType]="dateRange" [NepaliDateInGridParams]="NepaliDateInGridSettings"
    (onDateChange)="onDateChange($event)" [grid-showExport]="true" [grid-exportOptions]="gridExportOptions">
  </dsf-grid>
</div>
