<input type="button" class="btn btn-primary" (click)="AddUnitOfMeasurement()" [value]="'PHARMACY.ADD_UNITOFMESUREMENT' | translate" />
<div class="row">
  <div class="col-md-12 col-xs-12 col-sm-12">
    <dsf-grid [grid-colDefaults]="unitofmeasurementGridColumns" [grid-data]="unitofmeasurementList"
      (grid-actions)="UnitOfMeasurementGridActions($event)"> </dsf-grid>
  </div>
</div>
<!--Model Box Starting Here-->
<div class="popup-static portlet box portlet-fullscreen inv_modal" *ngIf="showUnitOfMeasurementAddPage">
  <div class="portlet-body form">
    <div class="row">
      <div class="col-md-4 col-md-offset-4">
        <div class="modelbox-div clearfix">
          <div class="caption lb-caption">
            <h3><span *ngIf="!update">{{ 'PHARMACY.ADD_UNIT_OF_MEASUREMENT' | translate }}</span> <span *ngIf="update">{{ 'PHARMACY.UPDATE_UNIT_OF_MEASUREMENT' | translate }}</span></h3>
            <a class="btn btn-danger" (click)="Close()" [title]="'COMMON.CANCEL' | translate"><i class="fa fa-times"></i></a>
          </div>

          <!--Model Box Body Start-->
          <form [formGroup]="CurrentUnitOfMeasurement.UnitOfMeasurementValidator" class="form-horizontal hm-form">
            <div class="form-body">
              <div class="form-group">
                <label class="control-label col-md-5">{{ 'PHARMACY.UNIT_OF_MEASUREMENT' | translate }}<sup>*</sup><b>:</b></label>
                <div class="col-md-7">
                  <input id="uomname" class="form-control" type="text" maxlength="50" [(ngModel)]="CurrentUnitOfMeasurement.UOMName"
                    formControlName="UOMName" value="" [placeholder]="'PHARMACY.ENTER_UNIT_OF_MEASUREMENT' | translate" (keyup.enter)="setFocusById('description')" />
                  <span class="color-red font-sm"
                    [hidden]="CurrentUnitOfMeasurement.IsValidCheck('UOMName','required') || !(CurrentUnitOfMeasurement.IsDirty('UOMName'))">{{ 'PHARMACY.UNIT_OF_MEASUREMENT_IS_REQUIRED' | translate }}</span>
                </div>
              </div>
              <div class="form-group">
                <label class="control-label col-md-5">{{ 'GRID_HEADERS.DESCRIPTION' | translate }}<b>:</b></label>
                <div class="col-md-7">
                  <input id="description" class="form-control" type="text" maxlength="100" (keyup.enter)="!update?setFocusById('saveuom'):setFocusById('updateuom')"
                    [(ngModel)]="CurrentUnitOfMeasurement.Description" [ngModelOptions]="{standalone: true}" value=""
                    [placeholder]="'PHARMACY.ENTER_DESCRIPTION' | translate" />
                </div>
              </div>
              <div class="form-group">
                <label class="control-label col-md-5">{{ 'PHARMACY.ISACTIVE' | translate }}<b>:</b></label>
                <div class="col-md-7">
                  <div class="input-group">
                    <div class="icheck-inline">
                      <label class="mt-checkbox mt-checkbox-outline">
                        <input name="IsActive" type="checkbox" value="IsActive"
                          [(ngModel)]="CurrentUnitOfMeasurement.IsActive" [ngModelOptions]="{standalone: true}">
                        <span></span> </label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="all-buttons text-right">
                <button type="button" id="saveuom" class="btn green btn-success" *ngIf="!update"
                  (click)="Add()">{{ 'COMMON.SAVE' | translate }}</button>
                <button type="button" id="updateuom" class="btn green btn-success" *ngIf="update"
                  (click)="Update()">{{ 'COMMON.UPDATE' | translate }}</button>
              </div>
            </div>
          </form>
          <!--</form>-->
          <!--Model Box Body End-->
        </div>
      </div>
    </div>
  </div>
</div>
