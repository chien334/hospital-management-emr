<style>
  .from-to-{{ 'GRID_HEADERS.DATE' | translate }}-container {
    margin-bottom: 1.5rem;
  }
</style>
<div class="row">
  <div class="col-md-6">
    <div class="caption custom-caption no-margin"><i class="fa fa-bar-chart"></i>
      <span class="caption-subject">{{ 'INVENTORY.RETURN_TO_SUPPLIER_REPORT' | translate }}</span>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-12 from-to-date-container">
    <from-to-date-select (on-change)="selectDate($event)">
    </from-to-date-select>
  </div>
  <div class="col-md-4">
    <div class="form-group row">
      <label class="control-label col-md-5">{{ 'INVENTORY.VENDOR_NAME' | translate }}<sup>*</sup><b style="float:right;">:</b></label>
      <div class="col-md-6 autocomplete-item">
        <input id="VendorName" dsf-auto-complete class="form-control" [(ngModel)]="selectedVndr" [source]="VendorList" [list-formatter]="VendorListFormatter" [placeholder]="'INVENTORY.SELECT_VENDOR_NAME' | translate" display-property-name="VendorName" value-property-name=null (valueChanged)="GetVendorDetails()" (focusout)="GetVendorDetails()" onclick="this.select();" [match-formatted]="true" />
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="form-group row">
      <label class="control-label col-md-5">{{ 'INVENTORY.ITEM' | translate }} {{ 'COMMON.NAME' | translate }}<sup>*</sup><b style="float:right;">:</b></label>
      <div class="col-md-6 autocomplete-item">
        <input id="ItemName" dsf-auto-complete class="form-control" [(ngModel)]="selecteditem" [source]="itemList" [list-formatter]="ItemListFormatter" [placeholder]="'INVENTORY.SELECT_ITEM_NAME' | translate" display-property-name="ItemName" value-property-name=null (valueChanged)="GetItemDetails()" (focusout)="GetItemDetails()" onclick="this.select();" [match-formatted]="true" />
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="form-group row">
      <label class="control-label col-md-5">{{ 'INVENTORY.BATCH_NUMBER' | translate }}<b style="float:right;">:</b></label>
      <div class="col-md-6">
        <input type="text" [(ngModel)]="BatchNumber" [ngModelOptions]="{standalone: true}" [placeholder]="'INVENTORY.ENTER_BATCH_NO' | translate" style="width:100%!important;">
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="form-group row">
      <label class="control-label col-md-5">{{ 'INVENTORY.GOOD_RECEIPT_NUMBER' | translate }}<b style="float:right;">:</b></label>
      <div class="col-md-6">
        <input type="number" [(ngModel)]="GoodReceiptNumber" [ngModelOptions]="{standalone: true}" [placeholder]="'INVENTORY.ENTER_GOOD_RECEIPT_NO' | translate" style="width:100%!important;">
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="form-group row">
      <label class="control-label col-md-5">{{ 'INVENTORY.CREDIT_NOTE_NUMBER' | translate }}<b style="float:right;">:</b></label>
      <div class="col-md-6">
        <input type="number" [(ngModel)]="CreditNoteNumber" [ngModelOptions]="{standalone: true}" [placeholder]="'INVENTORY.ENTER_CREDIT_NOTE_NO' | translate" style="width:100%!important;">
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <button class="btn green btn-success" type="button" (click)="Load()" [disabled]="loading">
      <i class="fa fa-search"></i>&nbsp;
      <span *ngIf="!loading">{{ 'INVENTORY.LOAD' | translate }}</span>
      <span *ngIf="loading">{{ 'INVENTORY.LOADING' | translate }}.</span>
    </button>
  </div>
</div>

<div class="row">
  <div class="col-lg-12 col-sm-12">
    <dsf-grid [grid-colDefaults]="returnToSupplierGridColumns" [grid-data]="ReturnToSupplierData" (onDateChange)="OnDateRangeChange($event)" [NepaliDateInGridParams]="NepaliDateInGridSettings" [grid-exportOptions]="GetGridExportOptions()" [grid-showExport]="true" [report-title]="'Return To Supplier Report'" [report-for]="'inventory'" [show-header]="true" [filter-parameters]="FilterParameters">
    </dsf-grid>
  </div>
</div>
