<div class="row">
  <div class="col-md-12">
    <div class="col-md-2 col-xs-12" [ngStyle]="{'padding-top': showSelector ? '30px' : '0' }">
      <select class="form-control" [(ngModel)]="rangeType" (change)="RangeTypeOnChange()" style="width:auto;">
        <option value="today">{{ 'ACCOUNTING.TODAY' | translate }}</option>
        <option value="thisMonth">{{ 'ACCOUNTING.THIS_MONTH' | translate }}</option>
        <option value="last3Months">{{ 'ACCOUNTING.LAST_3_MONTHS' | translate }}</option>
        <option value="last6Months">{{ 'ACCOUNTING.LAST_6_MONTHS' | translate }}</option>
        <option value="currFiscalYear">{{ 'ACCOUNTING.CURRENT_FISCAL_YEAR' | translate }}</option>
        <option value="custom">{{ 'ACCOUNTING.CUSTOM_DATE' | translate }}</option>
      </select>
    </div>
    <div *ngIf="showLabel" class="col-md-8 col-xs-12">
      <label *ngIf="!isOutOfFiscalYearDate" class="control-label col-md-4" style="margin:7px"><b>{{ 'ACCOUNTING.FROM_DATE' | translate }} : {{fromDate}}</b></label>
      <label *ngIf="isOutOfFiscalYearDate" class="control-label col-md-8" style="margin:7px"><b>{{ 'ACCOUNTING.FISCAL_YEAR_START_DATE_FROM_DATE' | translate }}: {{fromDate}}</b></label>
      <label class="control-label col-md-4" style="margin:7px"><b>{{ 'ACCOUNTING.TO_DATE' | translate }} : {{toDate}}</b></label>
    </div>
    <div *ngIf="showSelector" class="col-md-10 col-xs-12">
      <!-- <div class="col-md-4">
        <label style="margin:7px"> <b> From Date </b> <b>:</b></label>
        <dsf-date-picker [(ngModel)]="fromDate" [ngModelOptions]="{standalone: true}" ngDefaultControl>
        </dsf-date-picker>
      </div>
      <div class="col-md-4">
        <label style="margin:7px"><b> To Date </b><b>:</b></label>
        <dsf-date-picker [(ngModel)]="toDate" [ngModelOptions]="{standalone: true}" ngDefaultControl>
        </dsf-date-picker>
      </div> -->
      <div class="col-md-8">
        <label style="margin:7px"> <b> {{ 'ACCOUNTING.SELECT_FISCAL_YEAR_COLON' | translate }}</b></label>
        <fiscal-year-calendar [showSingleDatePicker]="false" [showAllFiscalYear]="false" (fiscalYearDate)="selectDate($event)"> </fiscal-year-calendar>
      </div>
      <!-- <div class="col-md-2" [ngStyle]="{'padding-top': showSelector ? '30px' : '0' }">
        <input style="width:100px;font-weight:bold;" type="button" class="blue btn" value="Load" (click)="ChangeCustomDate()" />
      </div> -->
    </div>
  </div>
</div>
