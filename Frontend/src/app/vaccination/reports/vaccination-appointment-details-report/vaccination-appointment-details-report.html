<div class="wrapper">
    <div class="row">
        <div class="form-horizontal">
            <div class="form-body">
                <div class="col-md-12">
                    <div class="caption custom-caption" style="float: left;"> <i
                            class="glyphicon glyphicon-asterisk"></i> <span class="caption-subject">{{ 'VACCINATION.APPOINTMENT_DETAILS_REPORT' | translate }}</span>
                    </div>
                </div>
                <div class="col-md-12">
                    <div class="row">
                        <div class="col-md-6">
                            <from-to-date-select (on-change)="OnFromToDateChange($event)"
                                [date-settings-name]="'billing-reports'">
                            </from-to-date-select>
                        </div>
                        <div class="col-md-4">
                            {{ 'VACCINATION.APPOINTMENT_TYPE' | translate }} : <select [(ngModel)]="AppointmentType"
                                [ngModelOptions]="{standalone: true}" style="width:100px;height:30px;">
                                <option value="all">{{ 'COMMON.ALL' | translate }}</option>
                                <option value="new">{{ 'COMMON.NEW' | translate }}</option>
                                <option value="followup">{{ 'VACCINATION.FOLLOWUP' | translate }}</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn green btn-success" type="button"
                                (click)="GetAppointmentDetailsReport();this.loading=true;" [disabled]="loading"> <i
                                    class="fa fa-search"></i> {{ 'VACCINATION.SHOW_REPORT' | translate }}
                            </button>
                            <span *ngIf="loading">{{ 'COMMON.LOADING_PLEASE_WAIT' | translate }}</span>
                        </div>

                    </div>
                    <div class="col-md-6 col-xs-12">

                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12 col-sm-12" *ngIf="DailyAppointmentReportData.length>0">
            <dsf-grid [grid-colDefaults]="DailyAppointmentReportGridColumns" [grid-data]="DailyAppointmentReportData"
                [grid-exportOptions]="gridExportOptions" [grid-showExport]="true"
                (grid-onExport)="OnGridExport($event)" [NepaliDateInGridParams]="NepaliDateInGridSettings">
            </dsf-grid>
        </div>
    </div>
</div>
